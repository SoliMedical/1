name: Deploy Soli Medical to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/PUBLISH_LOG.md
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repository guard
        run: node scripts/check-repository.mjs
      - name: Official release parity guard
        run: node scripts/release-guard.mjs --remote-name origin
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record successful publication
        env:
          PAGES_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/record-publication.mjs \
            --commit "${{ github.sha }}" \
            --run-url "$PAGES_RUN_URL"
          if git diff --quiet -- docs/PUBLISH_LOG.md; then
            exit 0
          fi
          git config user.name "soli-medical-pages[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PUBLISH_LOG.md
          git commit -m "docs: record successful Pages publish"
          git push
