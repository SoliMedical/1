                // ---- LOGIN SESSION PERSISTENCE ----
                // Keeps the doctor/staff logged in across page reloads or when switching between
                // desktop/mobile view on the same browser, instead of being signed out unexpectedly.
                sessionKey: 'soliMedicalSession_v1',
                deviceTrustKey: 'soliMedicalDeviceTrust_v1',
                deviceTrustDurationMs: 30 * 24 * 60 * 60 * 1000,
                                deviceTrust: null,
                getUserCredentialVersion(user) {
                    const source = `${String(user?.email || '').trim().toLowerCase()}|${String(user?.password || '')}`;
                    let hash = 2166136261;
                    for (let index = 0; index < source.length; index += 1) {
                        hash ^= source.charCodeAt(index);
                        hash = Math.imul(hash, 16777619);
                    }
                    return `${user?.id || ''}:${hash >>> 0}`;
                },
                restoreDeviceTrust() {
                    try {
                        const raw = localStorage.getItem(this.deviceTrustKey);
                        const trust = raw ? JSON.parse(raw) : null;
                        if (trust?.expiresAt && Date.parse(trust.expiresAt) <= Date.now()) {
                            localStorage.removeItem(this.deviceTrustKey);
                            this.deviceTrust = null;
                            return;
                        }
                        this.deviceTrust = trust;
                    } catch (error) {
                        console.warn('تعذر استعادة اعتماد هذا الجهاز:', error);
                        this.deviceTrust = null;
                    }
                },

                enrollDevice(user) {
                    const trust = {
                        userId: user.id,
                        credentialVersion: this.getUserCredentialVersion(user),
                        enrolledAt: new Date().toISOString(),
                        lastVerifiedAt: new Date().toISOString(),
                        expiresAt: new Date(Date.now() + this.deviceTrustDurationMs).toISOString(),
                        mode: 'online-first-local-afterward'
                    };
                    this.deviceTrust = trust;
                    try {
                        localStorage.setItem(this.deviceTrustKey, JSON.stringify(trust));
                    } catch (error) {
                        console.warn('تعذر حفظ اعتماد هذا الجهاز:', error);
                    }
                },

                isDeviceTrustValid(user) {
                    return Boolean(
                        this.deviceTrust &&
                        String(this.deviceTrust.userId) === String(user?.id) &&
                        this.deviceTrust.credentialVersion === this.getUserCredentialVersion(user) &&
                        (!this.deviceTrust.expiresAt || Date.parse(this.deviceTrust.expiresAt) > Date.now())
                    );
                },

                revokeDeviceTrust() {
                    this.deviceTrust = null;
                    try { localStorage.removeItem(this.deviceTrustKey); } catch (error) { console.warn('تعذر إبطال اعتماد الجهاز:', error); }

                restoreSession() {
                    try {
                        const raw = localStorage.getItem(this.sessionKey);
                        if (!raw) return;

                async resetClinicDataEverywhere() {
                    if (this.cloudResetBusy) return;
                    if (this.currentUser?.role !== 'admin') {
                        alert('هذا الإجراء متاح للمدير فقط.');
                        return;
                    }
                    const admin = (this.users || []).find(user => user.role === 'admin' && user.active !== false);
                    const expectedPassword = String(admin?.password || this.currentUser?.password || '');
                    if (!expectedPassword || String(this.cloudResetPasswordInput || '') !== expectedPassword) {
                        alert('الرقم السري للمدير غير صحيح.');

                    }
                    if (String(this.cloudResetDemoAcknowledgement || '').trim() !== 'بيانات تجريبية') {
                        alert('هذه العملية محجوبة لحماية بيانات المرضى. اكتب «بيانات تجريبية» لتأكيد أن العيادة لا تحتوي بيانات حقيقية.');
                        return;
                    }
                    if (String(this.cloudResetConfirmation || '').trim() !== 'حذف') {
                        alert('اكتب كلمة «حذف» في خانة التأكيد قبل المتابعة.');
                        return;
                    }
                    if (!confirm('تحذير نهائي للبيانات التجريبية فقط: سيتم حذف المرضى والزيارات والوصفات والفواتير والمصروفات وقائمة الانتظار وسجل التعارضات من النسخة المحلية والسحابة، ثم تُفرغ على جميع الأجهزة المتصلة. ستبقى حسابات المستخدمين وإعدادات العيادة محفوظة. هل تؤكد أن هذه بيانات تجريبية فقط؟')) return;

                    this.cloudResetBusy = true;
                    const token = `RESET-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
                    const resetData = this.getCloudResetDataSnapshot();
                    resetData._resetMeta = {
                        token,
                        requestedAt: new Date().toISOString(),
                        requestedBy: this.currentUser?.fullName || 'المدير',
                        scope: 'explicit-demo-clinical-and-financial-records',
                        demoDataAcknowledged: true
                    };
                    try {
                        if (this.cloudSyncEnabled && this.cloudAuthReady && firestoreDB) {
                            const docRef = firestoreDB.doc(this.cloudDocPath);
                            const isV2Operational = this.isV2OperationalSyncActive();
                            const [legacySnapshot, ...v2Snapshots] = await Promise.all([
                                docRef.get({ source: 'server' }),
                                ...(isV2Operational ? this.getDemoResetV2CollectionNames().map(name => this.getV2Collection(name).get()) : [])
                            ]);
                            const v2Documents = v2Snapshots.flatMap(snapshot => snapshot.docs);
                            if (v2Documents.length > 400) {
                                throw new Error('demo-reset-document-limit');
                            }
                            const remoteMeta = legacySnapshot.exists ? (legacySnapshot.data()._syncMeta || {}) : {};
                            const revision = Number(remoteMeta.revision || this.syncRevision || 0) + 1;
                            resetData._syncMeta = {
                                revision,
                                writerId: this.syncDeviceId,
                                writerName: this.currentUser?.fullName || 'المدير',
                                updatedAt: new Date().toISOString(),
                                operation: 'explicit-demo-reset'
                            };
                            const batch = firestoreDB.batch();
                            batch.set(docRef, resetData, { merge: false });
                            v2Documents.forEach(document => batch.delete(document.ref));
                            await batch.commit();
                            this.v2MirrorFingerprints = {};

                            this.cloudStatus = 'online';
                        } else {
                            this.cloudStatus = 'offline';

                        this.applyCloudResetSnapshot(resetData, token);
                        this.showCloudResetModal = false;
                        this.cloudResetPasswordInput = '';
                        this.cloudResetConfirmation = '';
                        this.cloudResetDemoAcknowledgement = '';
                        alert('تم حذف السجلات التجريبية الطبية والمالية من السحابة وتفريغها على الأجهزة المتصلة بنجاح.');

                        console.error('تعذر تنفيذ إعادة الضبط السحابية:', error);

                        if (error?.message === 'demo-reset-document-limit') {
                            alert('تم إيقاف الإجراء لأن عدد وثائق V2 أكبر من الحد الآمن لإعادة ضبط بيانات تجريبية من زر واحد. لم تُمسح أي بيانات؛ نزّل نسخة احتياطية وراجع الخطة الإدارية أولاً.');
                        } else {
                            alert('تعذر تنفيذ الحذف السحابي. لم تُمسح البيانات المحلية؛ تحقق من الاتصال وقواعد Firestore ثم أعد المحاولة.');
                        }
                    } finally {
                        this.cloudResetBusy = false;
                    }
                },

                downloadClinicBackup() {
                    try {
                        this.persistState();

                        this.persistentKeys.forEach(key => { backupData[key] = this[key]; });
                        const payload = {
                            format: 'soli-medical-backup',
                            version: 1,
                            appName: 'Soli Medical',
                            exportedAt: new Date().toISOString(),
                            theme: this.darkMode ? 'dark' : 'light',
                            data: backupData
                        };
                        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const anchor = document.createElement('a');
                        const stamp = new Date().toISOString().replace(/[:.]/g, '-');
                        anchor.href = url;
                        anchor.download = `soli-medical-backup-${stamp}.json`;
                        document.body.appendChild(anchor);
                        anchor.click();
                        anchor.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                        const visitCount = this.patients.reduce((sum, patient) => sum + (Array.isArray(patient.records) ? patient.records.length : 0), 0);
                        this.backupInfo = `تم تنزيل نسخة احتياطية تشمل ${this.patients.length} مريضاً و${visitCount} زيارة.`;
                    } catch (err) {
                        console.error('تعذر إنشاء النسخة الاحتياطية:', err);
                        this.backupInfo = 'تعذر إنشاء النسخة الاحتياطية. تأكد من توفر مساحة تخزين في المتصفح ثم أعد المحاولة.';
                    }
                },

                handleBackupImport(event) {
                    const file = event.target.files?.[0];
                    if (!file) return;
                    const input = event.target;
                    const reader = new FileReader();
                    reader.onload = () => {
                        try {
                            const payload = JSON.parse(reader.result);
                            const source = payload?.data && typeof payload.data === 'object' ? payload.data : payload;
                            const validKeys = this.persistentKeys.filter(key => Object.prototype.hasOwnProperty.call(source, key));
                            if (!validKeys.length || !Array.isArray(source.patients) || !Array.isArray(source.users)) {
                                throw new Error('invalid-backup');
                            }
                            const patientCount = source.patients.length;
                            const visitCount = source.patients.reduce((sum, patient) => sum + (Array.isArray(patient.records) ? patient.records.length : 0), 0);
                            const approved = confirm(`سيتم استبدال البيانات المحلية الحالية بنسخة تحتوي على ${patientCount} مريضاً و${visitCount} زيارة. يُنصح بأخذ نسخة احتياطية حالية أولاً. هل تريد المتابعة؟`);
                            if (!approved) return;
                            this.applyingRemoteUpdate = true;
                            validKeys.forEach(key => { this[key] = source[key]; });
                            this.persistState();
                            if (payload.theme === 'light') this.darkMode = false;
                            if (payload.theme === 'dark') this.darkMode = true;
                            this.backupInfo = `تمت استعادة ${patientCount} مريضاً و${visitCount} زيارة. ستتم إعادة تحميل التطبيق لتطبيق البيانات بالكامل.`;
                            this.renderIcons();
                            setTimeout(() => window.location.reload(), 700);
                        } catch (err) {
                            console.error('تعذر استعادة النسخة الاحتياطية:', err);
                            this.backupInfo = 'ملف النسخة الاحتياطية غير صالح أو لا ينتمي إلى Soli Medical.';
                        } finally {
                            input.value = '';
                        }
                    };
                    reader.onerror = () => {
                        input.value = '';
                        this.backupInfo = 'تعذر قراءة ملف النسخة الاحتياطية.';
                    };
                    reader.readAsText(file);
                },

                // ---- LOCAL DATA PERSISTENCE (localStorage) ----
                // Local storage is the offline safety layer. Firebase/Firestore mirrors these

                storageKey: 'soliMedicalData_v1',
                    usersWriteInFlight: false,
                usersLocalChangesPending: false,
                usersChangeSequence: 0,
                persistentKeys: ['patients', 'waitingQueue', 'appointments', 'invoices', 'prescriptions', 'clinics', 'doctorInfo', 'clinicLogoUrl', 'clinicLogoStoragePath', 'visitTypePrices', 'symptomsList', 'chronicDiseasesList', 'medicinesMasterList', 'expenses', 'expenseCategories', 'labTestsMasterList', 'radiologyMasterList', 'vitalSignsMasterList', 'recordFormSections', 'syncConflicts', 'recurringPrescriptionLists', 'recurringNotesList', 'recurringMedicinesList', 'auditLog', 'archiveManifests', 'idleLockEnabled', 'idleLockMinutes', 'dataMigration'],

                loadPersistedState() {

                        if (typeof saved.legacyLocalLogo === 'string') this.clinicLogoDataUrl = saved.legacyLocalLogo;
                        else if (typeof saved.clinicLogoDataUrl === 'string') this.clinicLogoDataUrl = saved.clinicLogoDataUrl;
                        this.recurringPrescriptionLists = this.normalizeRecurringPrescriptionLists(this.recurringPrescriptionLists);
                        if (Array.isArray(saved.users)) this.users = this.normalizeUsers(saved.users);
                    } catch (e) {
                        console.error('تعذر تحميل البيانات المحفوظة محلياً:', e);
                    }
                },

                persistState() {
                    try {
                        const dataToSave = {};
                        this.persistentKeys.forEach(key => { dataToSave[key] = this[key]; });
                        dataToSave.legacyLocalLogo = this.clinicLogoDataUrl || this.pendingClinicLogoDataUrl || '';
                        dataToSave.users = this.normalizeUsers(this.users);
                        localStorage.setItem(this.storageKey, JSON.stringify(dataToSave));
                    } catch (e) {
                        console.error('تعذر حفظ البيانات محلياً:', e);
                    }
                },

                renderIcons() {
                    this.$nextTick(() => {
                        this.preventPasswordSuggestionsInClinicalForms();
                        if (window.lucide) {
                            window.lucide.createIcons();
                        }
                    });
                },
                preventPasswordSuggestionsInClinicalForms() {
                    document.querySelectorAll('[data-soli-non-auth] input, [data-soli-non-auth] textarea, [data-soli-non-auth] select, input[type="tel"]').forEach(field => {
                        if (field instanceof HTMLInputElement && field.type === 'password') return;
                        field.setAttribute('autocomplete', 'off');
                        field.setAttribute('data-lpignore', 'true');
                        field.setAttribute('data-1p-ignore', 'true');
                        field.setAttribute('data-bwignore', 'true');
                        field.setAttribute('data-form-type', 'other');
                    });
                },
                showFlashNotice(message, type = 'success') {
                    this.flashNotice = String(message || '');
                    this.flashNoticeType = type;
                    if (this.flashNoticeTimer) clearTimeout(this.flashNoticeTimer);
                    this.flashNoticeTimer = setTimeout(() => { this.flashNotice = ''; }, 1000);
                },
                saveVisitTypePrices() {
                    const normalized = {};
                    Object.entries(this.visitTypePrices || {}).forEach(([name, value]) => {
                        normalized[name] = Math.max(0, Number(value) || 0);
                    });
                    this.visitTypePrices = normalized;
                    this.persistState();
                    this.queueCloudSync();
                    this.showFlashNotice('تم حفظ أسعار أنواع الزيارات والفواتير تلقائياً');
                },

                handleClinicLogoUpload(event) {
                    const file = event?.target?.files?.[0];
                    if (!file) return;
                    if (!file.type.startsWith('image/')) {
                        alert('يرجى اختيار ملف صورة صالح للشعار.');
                        event.target.value = '';
                        return;
                    }
                    if (file.size > 6 * 1024 * 1024) {
                        alert('حجم الشعار كبير. اختر صورة أقل من 6 ميجابايت.');
                        event.target.value = '';
                        return;
                    }
                    const reader = new FileReader();
                    reader.onload = () => {
                        const image = new Image();
                        image.onload = async () => {
                            const maxDimension = 512;
                            const scale = Math.min(1, maxDimension / image.width, maxDimension / image.height);
                            const canvas = document.createElement('canvas');
                            canvas.width = Math.max(1, Math.round(image.width * scale));
                            canvas.height = Math.max(1, Math.round(image.height * scale));
                            const context = canvas.getContext('2d');
                            context.clearRect(0, 0, canvas.width, canvas.height);
                            context.drawImage(image, 0, 0, canvas.width, canvas.height);
                            const compressedLogo = canvas.toDataURL('image/webp', 0.9);
                            if (compressedLogo.length > 1_250_000) {
                                alert('تعذر تجهيز الشعار لأن حجمه بعد الضغط كبير. اختر صورة أبسط أو أقل دقة.');
                                return;
                            }
                            this.clinicLogoDataUrl = compressedLogo;
                            this.pendingClinicLogoDataUrl = compressedLogo;
                            this.persistState();
                            event.target.value = '';
                            this.renderIcons();
                            await this.uploadClinicLogoDataUrl(compressedLogo);
                        };
                        image.onerror = () => alert('تعذر قراءة صورة الشعار. جرّب ملف PNG أو JPG آخر.');
                        image.src = reader.result;
                    };
                    reader.onerror = () => alert('تعذر قراءة ملف الشعار.');
                    reader.readAsDataURL(file);
                },

                removeClinicLogo() {
                    if (!this.getClinicLogoSrc()) return;
                    if (!confirm('هل تريد إزالة شعار العيادة من الروشتة؟')) return;
                    const previousPath = this.clinicLogoStoragePath;
                    this.clinicLogoUrl = '';
                    this.clinicLogoStoragePath = '';
                    this.clinicLogoDataUrl = '';
                    this.pendingClinicLogoDataUrl = '';
                    this.persistState();
                    this.queueCloudSync();
                    if (firestoreDB && navigator.onLine && this.cloudAuthReady) {
                        this.getV2Collection('settings').doc('general').set({ branding: { logoUrl: '', logoStoragePath: '', logoRemovedAt: new Date().toISOString(), previousLogoStoragePath: previousPath || '' } }, { merge: true }).catch(error => console.warn('تعذر تحديث إعدادات الشعار الجديدة:', error));
                        firestoreDB.doc(this.cloudDocPath).set({ clinicLogoUrl: '', clinicLogoStoragePath: '', clinicLogoDataUrl: firebase.firestore.FieldValue.delete() }, { merge: true }).catch(error => console.warn('تعذر إزالة مرجع الشعار القديم:', error));
                    }
                    this.renderIcons();
                },

                connectFirebaseForLocalUser() {
                    // Local login remains available offline. Online sessions are linked to a
                    // durable Firebase identity so live membership rules can be enforced.
                    if (!this.cloudSyncEnabled || !firebaseAuth || !this.isAuthenticated) {
                        this.cloudStatus = 'offline';
                        return;
                    }
                    if (!this.cloudAuthListenerStarted) {
                        this.cloudAuthListenerStarted = true;
                        this.observeFirebaseAuth();
                    }
                    if (firebaseAuth.currentUser && !firebaseAuth.currentUser.isAnonymous) {
                        this.cloudAuthReady = true;
                        this.cloudStatus = navigator.onLine ? 'online' : 'offline';
                        this.startCloudSync();
                        return;
                    }
                    if (!navigator.onLine) {
                        this.cloudStatus = 'offline';
                        return;
                    }
                    this.cloudStatus = 'connecting';
                    this.signInFirebaseForLocalUser(this.currentUser, { allowAnonymousFallback: true, createIfMissing: true }).catch(err => {
                        console.warn('تعذر تشغيل الهوية الدائمة للمزامنة:', err);
                        this.cloudStatus = 'offline';
                    });
                },

                firebaseRoleForLocalUser(user) {
                    if (user?.id === 1 || String(user?.id) === '1') return 'owner';
                    if (user?.role === 'admin') return 'admin';
                    const role = String(user?.role || '').toLowerCase();
                    return role.includes('طبيب') || role.includes('clinician') || role.includes('doctor') ? 'clinician' : 'assistant';
                },
                isPermanentFirebaseUser(user = firebaseAuth?.currentUser) {
                    return Boolean(user && !user.isAnonymous && user.uid);
                },
                firebaseIdentityErrorMessage(error) {
                    const code = String(error?.code || '');
                    if (code.includes('local-password-too-short') || code.includes('weak-password')) return 'كلمة مرور المدير المحلية الحالية أقصر من 6 أحرف، ولذلك لا يمكن إنشاء حساب Firebase بها. من بطاقة «إعدادات الاستعادة» أدناه، احفظ كلمة مرور جديدة من 6 أحرف أو أرقام على الأقل، ثم اضغط «تهيئة هوية Firebase الدائمة» مرة أخرى. لا تتغير بيانات المرضى أو السجل الطبي.';
                    if (code.includes('weak-password')) return 'كلمة المرور الحالية أقصر من 6 أحرف؛ حدّث كلمة مرور الدخول المحلي إلى 6 أحرف أو أكثر قبل تفعيل هوية Firebase الدائمة.';
                    if (code.includes('wrong-password') || code.includes('invalid-credential')) return 'كلمة مرور Firebase غير مطابقة. استخدم كلمة المرور الأخيرة للحساب أو حدّثها من المدير.';
                    if (code.includes('operation-not-allowed') || code.includes('configuration-not-found')) return 'تسجيل الدخول بالبريد وكلمة المرور غير متاح حالياً في إعدادات Firebase لهذا المشروع. فعّله من Firebase Authentication ثم أعد المحاولة.';
                    if (code.includes('invalid-email')) return 'تعذر إنشاء بريد Firebase من اسم المستخدم المحلي. راجع اسم المستخدم في بطاقة الحسابات ثم أعد المحاولة.';
                    if (code.includes('too-many-requests')) return 'تم إيقاف محاولات الدخول مؤقتاً لأسباب حماية. انتظر قليلاً ثم حاول مرة أخرى.';
                    if (code.includes('network-request-failed')) return 'تعذر الوصول إلى Firebase الآن؛ سيبقى النظام المحلي قابلاً للعمل دون اتصال.';
                    return 'تعذر التحقق من هوية Firebase الدائمة الآن؛ سيستمر النظام محلياً إلى أن تعود الخدمة.';
                },
                async signInFirebaseForLocalUser(localUser, options = {}) {
                    const { allowAnonymousFallback = true, createIfMissing = false } = options;
                    if (!firebaseAuth || !navigator.onLine || !localUser?.email) return { ok: false, persistent: false };
                    const firebaseEmail = this.firebaseEmailForUser(localUser.email);
                    const firebasePassword = String(localUser.password || '');
                    if (!firebasePassword) {
                        this.firebaseIdentityMessage = 'لا توجد كلمة مرور محلية محفوظة لهذا الجهاز لإثبات هوية Firebase. سجّل دخولاً من جهاز موثوق أو اطلب من المدير إعادة تهيئة الحساب.';
                        return { ok: false, persistent: false };
                    }
                    if (firebasePassword.length < 6) {
                        const passwordError = { code: 'local-password-too-short' };
                        this.firebaseIdentityIssueCode = passwordError.code;
                        this.firebaseIdentityStatus = 'تحتاج تحديث كلمة المرور';
                        this.firebaseIdentityMessage = this.firebaseIdentityErrorMessage(passwordError);
                        if (allowAnonymousFallback) {
                            try {
                                const anonymousCredential = await firebaseAuth.signInAnonymously();
                                this.firebaseIdentityUid = anonymousCredential.user?.uid || '';
                                this.firebaseIdentityEmail = '';
                                this.firebaseIdentityStatus = 'احتياطي مؤقت';
                                this.firebaseMembershipStatus = 'غير صالحة للجلسة المجهولة';
                                this.firebaseMembershipRole = '';
                                this.firebaseMembershipMessage = 'تعمل البيانات المحلية الآن، لكن عضوية العيادة لا تُمنح للجلسات المجهولة.';
                                return { ok: false, persistent: false, fallback: true, error: passwordError };
                            } catch (anonymousError) {
                                console.warn('تعذر بدء جلسة Firebase الاحتياطية:', anonymousError);
                            }
                        }
                        return { ok: false, persistent: false, error: passwordError };
                    }
                    try {
                        const credential = await firebaseAuth.signInWithEmailAndPassword(firebaseEmail, firebasePassword);
                        this.firebaseIdentityIssueCode = '';
                        this.firebaseIdentityUid = credential.user?.uid || '';
                        this.firebaseIdentityEmail = credential.user?.email || firebaseEmail;
                        this.firebaseIdentityStatus = 'هوية دائمة متصلة';
                        this.firebaseIdentityMessage = 'تم ربط جلسة المستخدم بهوية Firebase دائمة.';
                        this.attachFirebaseUidToLocalUser(localUser, credential.user?.uid || '');
                        await this.refreshFirebaseMembershipStatus(credential.user);
                        return { ok: true, persistent: true, user: credential.user };
                    } catch (signInError) {
                        // Firebase's email-enumeration protection can deliberately collapse a
                        // missing user into invalid-credential.  For a locally authenticated
                        // administrator we may safely try a one-time account creation; an
                        // existing account remains protected because Firebase rejects duplicates.
                        const initialSignInError = signInError;
                        const signInCode = String(signInError?.code || '');
                        const mayCreate = createIfMissing
                            && (signInCode.includes('user-not-found') || signInCode.includes('invalid-credential'));
                        if (mayCreate && firebasePassword.length >= 6) {
                            try {
                                const credential = await firebaseAuth.createUserWithEmailAndPassword(firebaseEmail, firebasePassword);
                                this.firebaseIdentityIssueCode = '';
                                this.firebaseIdentityUid = credential.user?.uid || '';
                                this.firebaseIdentityEmail = credential.user?.email || firebaseEmail;
                                this.firebaseIdentityStatus = 'هوية دائمة جديدة';
                                this.firebaseIdentityMessage = 'تم إنشاء هوية Firebase دائمة لهذا الحساب. أكمل فحص عضوية العيادة قبل تطبيق القواعد الحية.';
                                this.attachFirebaseUidToLocalUser(localUser, credential.user?.uid || '');
                                await this.refreshFirebaseMembershipStatus(credential.user);
                                return { ok: true, persistent: true, user: credential.user, created: true };
                            } catch (createError) {
                                signInError = String(createError?.code || '').includes('email-already-in-use')
                                    ? initialSignInError
                                    : createError;
                            }
                        }
                        this.firebaseIdentityIssueCode = String(signInError?.code || '');
                        this.firebaseIdentityMessage = this.firebaseIdentityErrorMessage(signInError);
                        if (allowAnonymousFallback) {
                            try {
                                const anonymousCredential = await firebaseAuth.signInAnonymously();
                                this.firebaseIdentityUid = anonymousCredential.user?.uid || '';
                                this.firebaseIdentityEmail = '';
                                this.firebaseIdentityStatus = 'احتياطي مؤقت';
                                this.firebaseMembershipStatus = 'غير صالحة للجلسة المجهولة';
                                this.firebaseMembershipRole = '';
                                this.firebaseMembershipMessage = 'تعمل البيانات المحلية الآن، لكن عضوية العيادة لا تُمنح للجلسات المجهولة.';
                                return { ok: false, persistent: false, fallback: true, error: signInError };
                            } catch (anonymousError) {
                                console.warn('تعذر بدء جلسة Firebase الاحتياطية:', anonymousError);
                            }
                        }
                        return { ok: false, persistent: false, error: signInError };
                    }
                },
                async provisionPersistentFirebaseIdentityForCurrentUser() {
                    if (!this.isAuthenticated || !this.currentUser) {
                        this.firebaseIdentityMessage = 'سجّل دخول المدير محلياً أولاً قبل تهيئة هوية Firebase.';
                        return false;
                    }
                    if (this.firebaseRoleForLocalUser(this.currentUser) !== 'owner' && this.currentUser?.role !== 'admin') {
                        this.firebaseIdentityMessage = 'تهيئة هوية Firebase الدائمة متاحة لمدير النظام فقط.';
                        return false;
                    }
                    if (!navigator.onLine || !firebaseAuth) {
                        this.firebaseIdentityMessage = 'تحتاج تهيئة الهوية الدائمة إلى اتصال بالإنترنت.';
                        return false;
                    }
                    this.firebaseIdentityBusy = true;
                    this.firebaseIdentityMessage = 'جارٍ تهيئة هوية Firebase الدائمة للمدير…';
                    try {
                        if (firebaseAuth.currentUser?.isAnonymous) await firebaseAuth.signOut();
                        const result = await this.signInFirebaseForLocalUser(this.currentUser, {
                            allowAnonymousFallback: false,
                            createIfMissing: true
                        });
                        if (!result.persistent) {
                            this.firebaseIdentityMessage = result.error
                                ? this.firebaseIdentityErrorMessage(result.error)
                                : 'لم تكتمل تهيئة هوية Firebase الدائمة. بقيت بيانات العيادة المحلية دون تغيير.';
                            return false;
                        }
                        await this.refreshFirebaseMembershipStatus(result.user);
                        return true;
                    } finally {
                        this.firebaseIdentityBusy = false;
                    }
                },
                attachFirebaseUidToLocalUser(localUser, uid, membershipStatus = '') {
                    if (!uid || !localUser) return;
                    const localUserId = String(localUser.id ?? '');
                    const user = (this.users || []).find(candidate => String(candidate.id ?? '') === localUserId)
                        || (this.users || []).find(candidate => String(candidate.email || '').trim().toLowerCase() === String(localUser.email || '').trim().toLowerCase());
                    const uidChanged = user && user.firebaseUid !== uid;
                    const nextMembershipStatus = membershipStatus || (uidChanged
                        ? 'membership_pending'
                        : (user?.firebaseAuthStatus || 'membership_pending'));
                    if (user && (uidChanged || user.firebaseAuthStatus !== nextMembershipStatus)) {
                        user.firebaseUid = uid;
                        user.firebaseAuthStatus = nextMembershipStatus;
                        if (this.currentUser && String(this.currentUser.id ?? '') === String(user.id ?? '')) this.currentUser = this.withCompatiblePermissions(user);
                        this.persistState();
                        this.queueCloudSync();
                    }
                },
                async refreshFirebaseMembershipStatus(user = firebaseAuth?.currentUser) {
                    if (!this.isPermanentFirebaseUser(user)) {
                        this.firebaseMembershipStatus = 'غير صالحة للجلسة المجهولة';
                        this.firebaseMembershipRole = '';
                        this.firebaseMembershipMessage = 'لا يمكن فحص العضوية أو تطبيق قواعد Firebase بهوية مجهولة.';
                        return false;
                    }
                    if (!firestoreDB || !navigator.onLine) {
                        this.firebaseMembershipStatus = 'بانتظار الاتصال';
                        this.firebaseMembershipMessage = 'سيتم فحص عضوية العيادة عند عودة الإنترنت.';
                        return false;
                    }
                    try {
                        const memberSnapshot = await this.getV2ClinicRef().collection('members').doc(user.uid).get({ source: 'server' });
                        const member = memberSnapshot.exists ? memberSnapshot.data() : null;
                        if (member?.status === 'active') {
                            this.firebaseMembershipStatus = 'نشطة';
                            this.firebaseMembershipRole = member.role || '';
                            this.firebaseMembershipMessage = `عضوية العيادة نشطة بدور ${member.role || 'غير محدد'}.`;
                            // تُعد هذه القراءة الحية هي المرجع لحالة البطاقة؛ لا تترك
                            // حالة "بانتظار التفعيل" المحلية بعد نجاح عضوية Firestore.
                            this.attachFirebaseUidToLocalUser(this.currentUser, user.uid, 'active');
                            return true;
                        }
                        this.firebaseMembershipStatus = member ? 'موقوفة' : 'غير موجودة';
                        this.firebaseMembershipRole = member?.role || '';
                        this.firebaseMembershipMessage = member
                            ? 'وثيقة العضوية موجودة لكنها ليست نشطة. راجع المدير أو مسار التهيئة الإداري.'
                            : 'لم تُنشأ وثيقة عضوية لهذا المستخدم بعد. أنشئ عضوية المدير الأولى قبل نشر القواعد الحية.';
                        return false;
                    } catch (error) {
                        this.firebaseMembershipStatus = 'تعذر الفحص';
                        this.firebaseMembershipMessage = 'تعذر قراءة وثيقة العضوية. إذا كانت القواعد الحية منشورة، استخدم أداة المدير الموثوقة لإنشائها أو استعادتها.';
                        console.warn('تعذر فحص عضوية Firebase:', error);
                        return false;
                    }
                },
                async ensureClinicMembership() {
                    if (this.currentUser?.role !== 'admin') {
                        alert('تهيئة عضوية العيادة متاحة لمدير النظام فقط.');
                        return false;
                    }
                    const user = firebaseAuth?.currentUser;
                    if (!this.isPermanentFirebaseUser(user)) {
                        this.firebaseMembershipMessage = 'سجّل الدخول بهوية Firebase دائمة أولاً. إذا كانت كلمة المرور أقل من 6 أحرف، حدّثها محلياً ثم أعد الدخول.';
                        return false;
                    }
                    if (!firestoreDB || !navigator.onLine) {
                        this.firebaseMembershipMessage = 'تحتاج تهيئة العضوية إلى اتصال بالإنترنت.';
                        return false;
                    }
                    this.firebaseMembershipBusy = true;
                    this.firebaseMembershipMessage = 'جارٍ تهيئة وثيقة عضوية المدير...';
                    try {
                        await this.getV2ClinicRef().collection('members').doc(user.uid).set({
                            status: 'active',
                            role: 'owner',
                            createdAt: new Date().toISOString(),
                            createdBy: 'owner-bootstrap-ui',
                            firebaseEmail: user.email || '',
                            localUserId: String(this.currentUser?.id || '')
                        }, { merge: true });
                        await this.refreshFirebaseMembershipStatus(user);
                        return true;
                    } catch (error) {
                        this.firebaseMembershipStatus = 'بحاجة لمسار إداري';
                        this.firebaseMembershipMessage = 'منعت قواعد Firebase إنشاء العضوية من المتصفح، وهذا متوقع بعد النشر الحي. شغّل أداة المدير الموثوقة لإنشاء العضوية أو استعادتها.';
                        console.warn('تعذر تهيئة عضوية المدير من المتصفح:', error);
                        return false;
                    } finally {
                        this.firebaseMembershipBusy = false;
                    }
                },

                // يعرض حالة الاتصال دون بيانات حساسة ولا يغيّر أية بيانات محلية أو سحابية.
                // عضويات المستخدمين الآخرين تُنشأ حصراً عبر Firebase Admin SDK أو Firebase Console
                // التزاماً بقواعد Firestore التي تمنع منح العضوية من المتصفح.
                diagnoseCloudConnection() {
                    const uid = firebaseAuth?.currentUser?.uid || '';
                    const report = {
                        localLoginOk: Boolean(this.isAuthenticated),
                        firebaseAuthPermanent: this.isPermanentFirebaseUser(),
                        firebaseUidShort: uid ? `${uid.slice(0, 6)}…` : '(بدون)',
                        identityStatus: this.firebaseIdentityStatus || '(غير معروف)',
                        identityIssueCode: this.firebaseIdentityIssueCode || '(لا يوجد)',
                        membershipStatus: this.firebaseMembershipStatus || '(غير مفحوصة)',
                        membershipRole: this.firebaseMembershipRole || '(بدون)',
                        cloudAuthReady: Boolean(this.cloudAuthReady),
                        cloudMembershipReady: Boolean(this.cloudMembershipReady),
                        cloudStatus: this.cloudStatus || '(غير معروف)',
                        online: Boolean(navigator.onLine),
                        membershipProvisioning: 'المسار الموثوق فقط (Firebase Admin SDK أو Firebase Console)'
                    };
                    console.table(report);
                    this.cloudDiagnosticsReport = report;
                    this.cloudDiagnosticsVisible = true;
                    return report;
                },

                async prepareUsersForOnlineLogin() {
                    // في المتصفح الجديد لا توجد قائمة users محلية بعد. نقرأ نسخة الحسابات
                    // من الخادم مباشرة، وليس من Firestore cache، ثم تبقى المقارنة محلية
                    // ولا تُرسل كلمة المرور إلى أي خادم آخر.
                    if (!this.cloudSyncEnabled || !firestoreDB || !navigator.onLine) return false;
                    try {
                        if (!(await this.waitForCloudAuthReady())) return false;
                        let remoteUsers = null;
                        for (let attempt = 0; attempt < 3; attempt += 1) {
                            const snapshot = await firestoreDB.doc(this.cloudDocPath).get({ source: 'server' });
                            remoteUsers = snapshot.exists ? snapshot.data()?.users : null;
                            const validUsers = this.normalizeUsers(remoteUsers);
                            if (validUsers.length) {
                                this.users = validUsers;
                                this.syncCurrentUserFromUsers();
                                this.persistState();
                                this.revokeDeviceTrust();
                                return true;
                            }
                            if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 350 * (attempt + 1)));
                        }
                        return false;
                    } catch (error) {
                        console.warn('تعذر تحميل أحدث حسابات العيادة من خادم Firestore قبل الدخول:', error);
                        return false;
                    }
                },

                async hashSecurityValue(value) {
                    const normalized = String(value || '').trim().toLocaleLowerCase('ar');
                    try {
                        if (window.crypto?.subtle) {
                            const bytes = new TextEncoder().encode(normalized);
                            const digest = await window.crypto.subtle.digest('SHA-256', bytes);
                            return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
                        }
                    } catch (error) {
                        console.warn('تعذر تجزئة إجابة الأمان:', error);
                    }
                    return btoa(unescape(encodeURIComponent(normalized)));
                },

                loadAdminSecuritySettings() {
                    const admin = this.users.find(user => user.id === 1);
                    this.securityForm.question = admin?.securityQuestion || '';
                    this.securityForm.answer = '';
                    this.securityForm.newPassword = '';
                    this.securitySaveFeedback = '';
                },

                async saveAdminSecuritySettings() {
                    if (this.currentUser?.role !== 'admin') {
                        alert('هذه الميزة متاحة للمدير فقط.');
                        return;
                    }
                    const question = String(this.securityForm.question || '').trim();
                    const answer = String(this.securityForm.answer || '').trim();
                    const newPassword = String(this.securityForm.newPassword || '').trim();
                    if (!question || answer.length < 3) {
                        alert('اختر سؤال أمان واكتب إجابته (3 أحرف على الأقل).');
                        return;
                    }
                    if (newPassword && newPassword.length < 6) {
                        alert('كلمة المرور الجديدة يجب أن تتكون من 6 أحرف أو أرقام على الأقل لتتوافق مع هوية Firebase الدائمة.');
                        return;
                    }
                    const admin = this.users.find(user => user.id === 1);
                    if (!admin) return;
                    const previousPassword = String(admin.password || '');
                    admin.securityQuestion = question;
                    admin.securityAnswerHash = await this.hashSecurityValue(answer);
                    if (newPassword) admin.password = newPassword;
                    if (this.currentUser.id === admin.id) this.currentUser = admin;
                    this.persistState();
                    const firebasePasswordResult = newPassword
                        ? await this.syncFirebasePasswordAfterLocalChange(admin, previousPassword, newPassword)
                        : { attempted: false, ok: true };
                    const cloudResult = await this.persistUsersToCloudNow();
                    if (navigator.onLine && this.cloudSyncEnabled && (!cloudResult.ok || (firebasePasswordResult.attempted && !firebasePasswordResult.ok && !firebasePasswordResult.deferred))) {
                        alert('تم حفظ التغيير محلياً فقط ولم يؤكَّد في السحابة. تحقق من الاتصال قبل الاعتماد على كلمة المرور الجديدة من جهاز آخر.');
                    }
                    this.securityForm.answer = '';
                    this.securityForm.newPassword = '';
                    this.securitySaveFeedback = newPassword
                        ? (firebasePasswordResult.ok
                            ? 'تم حفظ إعدادات الاستعادة وكلمة المرور محلياً، وتحديث هوية Firebase للجلسة الدائمة.'
                            : 'تم حفظ إعدادات الاستعادة وكلمة المرور محلياً أولاً. ستظل المزامنة تعمل عند اكتمال التحقق من هوية Firebase.')
                        : 'تم حفظ إعدادات الاستعادة محلياً.';
                    setTimeout(() => { this.securitySaveFeedback = ''; }, 3500);
                },

                async syncFirebasePasswordAfterLocalChange(localUser, previousPassword, newPassword) {
                    const currentIdentity = firebaseAuth?.currentUser;
                    const firebaseEmail = this.firebaseEmailForUser(localUser?.email || '');
                    if (!newPassword || !this.cloudSyncEnabled || !navigator.onLine || !this.isPermanentFirebaseUser(currentIdentity) || !firebaseEmail || String(currentIdentity.email || '').toLowerCase() !== firebaseEmail.toLowerCase()) {
                        return { attempted: false, ok: false, deferred: true };
                    }
                    try {
                        await currentIdentity.updatePassword(newPassword);
                        this.firebaseIdentityIssueCode = '';
                        return { attempted: true, ok: true };
                    } catch (initialError) {
                        const requiresRecentLogin = String(initialError?.code || '').includes('requires-recent-login');
                        if (!requiresRecentLogin || !previousPassword) {
                            console.warn('تعذر تحديث كلمة مرور Firebase بعد حفظ كلمة المرور المحلية؛ ستبقى البيانات محفوظة محلياً.', initialError);
                            return { attempted: true, ok: false, error: initialError };
                        }
                        try {
                            const credential = firebase.auth.EmailAuthProvider.credential(firebaseEmail, previousPassword);
                            await currentIdentity.reauthenticateWithCredential(credential);
                            await firebaseAuth.currentUser.updatePassword(newPassword);
                            this.firebaseIdentityIssueCode = '';
                            return { attempted: true, ok: true, reauthenticated: true };
                        } catch (reauthenticationError) {
                            console.warn('تعذر إعادة التحقق لتحديث كلمة مرور Firebase؛ ستبقى كلمة المرور المحلية والبيانات محفوظة.', reauthenticationError);
                            this.firebaseIdentityIssueCode = String(reauthenticationError?.code || initialError?.code || 'firebase-password-update-failed');
                            return { attempted: true, ok: false, error: reauthenticationError };
                        }
                    }
                },

                focusAdminPasswordUpdateForFirebase() {
                    if (this.currentUser?.role !== 'admin') {
                        alert('تحديث كلمة مرور المدير متاح من حساب المدير فقط.');
                        return;
                    }
                    this.securityForm.newPassword = '';
                    this.securitySaveFeedback = 'أدخل كلمة مرور جديدة من 6 أحرف أو أرقام على الأقل، ثم احفظ الإعدادات. بعد ذلك عُد لزر تهيئة هوية Firebase.';
                    this.$nextTick(() => {
                        const card = document.getElementById('admin-security-recovery');
                        const passwordField = document.getElementById('admin-security-new-password');
                        card?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        setTimeout(() => passwordField?.focus(), 220);
                    });
                },

                beginPasswordRecovery() {
                    const enteredEmail = String(this.loginForm.email || '').trim().toLowerCase();
                    const admin = this.users.find(user => user.id === 1 && user.email.trim().toLowerCase() === enteredEmail);
                    this.recoveryForm = { email: enteredEmail, answer: '', newPassword: '' };
                    this.recoveryState = { open: true, question: admin?.securityQuestion || '', userId: admin?.id || null, error: '', success: '' };
                    if (!admin) this.recoveryState.error = 'اكتب اسم مستخدم المدير أولاً، ثم اضغط نسيت كلمة المرور.';
                    else if (!admin.securityAnswerHash) this.recoveryState.error = 'لم تُضبط أسئلة الأمان لهذا المدير بعد. يجب إعدادها من داخل النظام أولاً.';
                },

                closePasswordRecovery() {
                    this.recoveryState = { open: false, question: '', userId: null, error: '', success: '' };
                    this.recoveryForm = { email: '', answer: '', newPassword: '' };
                },

                async recoverAdminPassword() {
                    const admin = this.users.find(user => user.id === 1 && user.email.trim().toLowerCase() === String(this.recoveryForm.email || '').trim().toLowerCase());
                    const answer = String(this.recoveryForm.answer || '').trim();
                    const newPassword = String(this.recoveryForm.newPassword || '').trim();
                    if (!admin || !admin.securityQuestion || !admin.securityAnswerHash) {
                        this.recoveryState.error = 'لا توجد بيانات استعادة مكتملة لهذا الحساب.';
                        return;
                    }
                    if (answer.length < 3 || newPassword.length < 6) {
                        this.recoveryState.error = 'اكتب إجابة الأمان وكلمة مرور جديدة من 6 أحرف أو أرقام على الأقل.';
                        return;
                    }
                    const answerHash = await this.hashSecurityValue(answer);
                    if (answerHash !== admin.securityAnswerHash) {
                        this.recoveryState.error = 'إجابة الأمان غير صحيحة.';
                        return;
                    }
                    const previousPassword = String(admin.password || '');
                    admin.password = newPassword;
                    this.persistState();
                    const firebasePasswordResult = await this.syncFirebasePasswordAfterLocalChange(admin, previousPassword, newPassword);
                    const cloudResult = await this.persistUsersToCloudNow();
                    if (navigator.onLine && this.cloudSyncEnabled && (!cloudResult.ok || (firebasePasswordResult.attempted && !firebasePasswordResult.ok && !firebasePasswordResult.deferred))) {
                        this.recoveryState.error = 'تم التغيير محلياً، لكن لم يُؤكَّد في السحابة. تحقق من الاتصال ثم أعد المحاولة.';
                        return;
                    }
                    this.loginForm.email = admin.email;
                    this.loginForm.password = '';
                    this.loginError = '';
                    this.recoveryState.success = 'تم تغيير كلمة مرور المدير. أغلق النافذة وسجّل الدخول بالكلمة الجديدة.';
                    this.recoveryForm.answer = '';
                    this.recoveryForm.newPassword = '';
                },

                async handleLogin() {
                    this.isLoading = true;
                    this.loginError = '';
                    const enteredEmail = (this.loginForm.email || '').trim().toLowerCase();
                    const enteredPassword = (this.loginForm.password || '').trim();
                    let matchedUser = this.users.find(u => u.email.trim().toLowerCase() === enteredEmail);
                    const localCredentialsMatch = Boolean(matchedUser?.password && matchedUser.password === enteredPassword);
                    let firebaseLogin = { persistent: false };

                    // لا ننتظر Firebase ولا نبدّل قائمة الحسابات عندما تكون بيانات الجهاز
                    // المحلي صحيحة. هذا يمنع خطأ الشبكة أو هوية Firebase غير المنشأة بعد
                    // من رفض دخول المدير إلى بيانات عيادته المحلية.
                    if (!localCredentialsMatch && navigator.onLine && this.cloudSyncEnabled && firebaseAuth) {
                        firebaseLogin = await this.signInFirebaseForLocalUser(
                            { ...(matchedUser || {}), email: enteredEmail, password: enteredPassword },
                            { allowAnonymousFallback: false, createIfMissing: false }
                        );
                        if (firebaseLogin.persistent) {
                            await this.prepareUsersForOnlineLogin();
                            matchedUser = this.users.find(u => u.email.trim().toLowerCase() === enteredEmail);
                            // Firebase has verified the submitted secret. It is retained only in
                            // this browser's encrypted/local state so future offline logins work;
                            // getCloudSafeUsers() explicitly omits it from Firestore writes.
                            if (matchedUser && !matchedUser.password && firebaseLogin.persistent) {
                                matchedUser.password = enteredPassword;
                                this.persistState();
                            }
                        }
                    }

                    if (!matchedUser || !(localCredentialsMatch || firebaseLogin.persistent)) {
                        this.loginError = navigator.onLine
                            ? 'تعذر التحقق من اسم المستخدم أو كلمة المرور. استخدم بيانات الدخول الأخيرة، أو اطلب من المدير تهيئة حساب Firebase وعضويته.'
                            : 'اسم المستخدم أو كلمة المرور غير صحيحة، كما أن هذا الجهاز يحتاج إلى أول دخول متصل بالإنترنت.';
                        this.isLoading = false;
                        return;
                    }
                    const trustedForThisUser = this.isDeviceTrustValid(matchedUser);
                    if (this.cloudSyncEnabled && !trustedForThisUser && !navigator.onLine) {
                        this.loginError = 'هذا المتصفح غير معتمد بعد. اتصل بالإنترنت لأول تسجيل دخول، ثم سيعمل النظام دون اتصال على هذا الجهاز.';
                        this.isLoading = false;
                        return;
                    }
                    if (matchedUser.active === false) {
                        this.loginError = 'هذا الحساب متوقف حالياً، يرجى التواصل مع مدير النظام.';
                        this.isLoading = false;
                        return;
                    }

                    // Local permissions remain the source of the visible navigation. Firebase is
                    // opened in the background only after local authentication succeeds, so the
                    // clinic remains usable even when the internet or Firebase is unavailable.
                    this.currentUser = matchedUser;
                    this.isAuthenticated = true;
                    if (this.cloudSyncEnabled && !trustedForThisUser) this.enrollDevice(matchedUser);
                    if (trustedForThisUser) {
                        this.deviceTrust.credentialVersion = this.getUserCredentialVersion(matchedUser);
                        this.deviceTrust.lastVerifiedAt = new Date().toISOString();
                        this.deviceTrust.expiresAt = new Date(Date.now() + this.deviceTrustDurationMs).toISOString();
                        try { localStorage.setItem(this.deviceTrustKey, JSON.stringify(this.deviceTrust)); } catch (error) { console.warn('تعذر تحديث اعتماد الجهاز:', error); }
                    }
                    this.saveSession(matchedUser.id);
                    this.landOnAllowedPage(matchedUser);
                    this.isLoading = false;
                    this.renderIcons();
                    this.connectFirebaseForLocalUser(matchedUser);
                },



                logout() {
                    this.isAuthenticated = false;
                    this.currentUser = null;
                    this.currentView = 'dashboard';
                    this.loginForm.password = '';
                    this.clearSession();
                    if (this.cloudSyncEnabled) {
                        firebaseAuth.signOut().catch(() => {});
                    }
                },

                async callClinicAccountGateway(action, user) {
                    if (!clinicAccountGatewayUrl) throw new Error('مسار الإدارة الذاتية غير مهيأ بعد.');
                    if (!navigator.onLine) throw new Error('تحتاج إدارة حسابات الفريق إلى اتصال بالإنترنت. تبقى بيانات العيادة محفوظة محلياً.');
                    const identity = firebaseAuth?.currentUser;
                    if (!this.isPermanentFirebaseUser(identity)) {
                        throw new Error('سجّل دخول مالك العيادة بهوية Firebase دائمة أولاً ثم أعد المحاولة.');
                    }
                    const token = await identity.getIdToken(true);
                    const response = await fetch(clinicAccountGatewayUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
                        body: JSON.stringify({
                            action,
                            member: {
                                localUserId: String(user.id ?? ''),
                                fullName: String(user.fullName || '').trim(),
                                email: String(user.email || '').trim(),
                                password: action === 'upsert' ? String(user.password || '') : undefined,
                                role: String(user.role || '').trim(),
                                active: user.active !== false,
                                firebaseUid: String(user.firebaseUid || '').trim() || undefined
                            }
                        })
                    });
                    const payload = await response.json().catch(() => ({}));
                    if (!response.ok || !payload?.ok) throw new Error(payload?.message || 'تعذر تنفيذ إدارة الحساب بأمان.');
                    return payload.result;
                },

                async syncUserMembership(userId, options = {}) {
                    const user = this.users.find(candidate => String(candidate.id) === String(userId));
                    if (!user) return false;
                    this.selfServiceAccountBusy = true;
                    this.selfServiceAccountMessage = 'جارٍ إنشاء أو تحديث هوية المستخدم وعضوية العيادة بشكل آمن…';
                    try {
                        const result = await this.callClinicAccountGateway('upsert', user);
                        user.firebaseUid = result.uid;
                        user.firebaseAuthStatus = result.status;
                        this.persistState();
                        const cloudResult = await this.persistUsersToCloudNow();
                        if (navigator.onLine && this.cloudSyncEnabled && !cloudResult.ok) {
                            this.selfServiceAccountMessage = 'تم تفعيل الحساب، وستُعاد مزامنة قائمة المستخدمين تلقائياً عند استقرار الاتصال.';
                        } else {
                            this.selfServiceAccountMessage = options.silent ? '' : 'تم تفعيل حساب الفريق وعضويته السحابية بنجاح.';
                        }
                        this.renderIcons();
                        return true;
                    } catch (error) {
                        user.firebaseAuthStatus = 'membership_pending';
                        this.persistState();
                        this.selfServiceAccountMessage = error?.message || 'تعذر تفعيل الحساب. لم تُحذف أية بيانات.';
                        return false;
                    } finally {
                        this.selfServiceAccountBusy = false;
                    }
                },

                async addUser() {
                    if (!this.newUserForm.fullName.trim() || !this.newUserForm.email.trim() || !this.newUserForm.password.trim()) {
                        alert('يرجى إدخال الاسم والبريد/اسم المستخدم وكلمة المرور');
                        return;
                    }
                    if (this.newUserForm.password.trim().length < 6) {
                        alert('كلمة مرور الحساب الجديد يجب ألا تقل عن 6 أحرف لحماية تسجيل الدخول.');
                        return;
                    }
                    if (this.users.some(u => u.email === this.newUserForm.email.trim())) {
                        alert('يوجد بالفعل حساب بنفس اسم المستخدم');
                        return;
                    }
                    const newUser = {
                        id: Date.now(),
                        fullName: this.newUserForm.fullName.trim(),
                        email: this.newUserForm.email.trim(),
                        password: this.newUserForm.password.trim(),
                        role: this.newUserForm.role,
                        active: true,
                        permissions: { ...this.newUserForm.permissions }
                    };
                    this.users.push(newUser);
                    this.userPermissionDrafts[newUser.id] = { ...newUser.permissions };
                    this.persistState();
                    const provisioned = await this.syncUserMembership(newUser.id, { silent: true });
                    if (!provisioned) {
                        alert('حُفظ الحساب محلياً، لكن لم تُستكمل العضوية السحابية. من بطاقة الحساب نفسه اختر «إعادة محاولة التفعيل» عند توفر الإنترنت.');
                    }

                    this.newUserForm = {
                        fullName: '',
                        email: '',
                        password: '',
                        role: 'موظف استقبال',
                        permissions: { dashboard: true, newVisit: true, followUps: true, patients: true, invoices: false, expenses: false, reports: false, pharmacy: false, settings: false }
                    };
                    this.renderIcons();
                },

                async removeUser(userId) {
                    if (userId === 1) {
                        alert('لا يمكن حذف حساب المدير الأساسي');
                        return;
                    }
                    if (!confirm('هل تريد حذف هذا الحساب؟')) return;
                    const user = this.users.find(candidate => candidate.id === userId);
                    if (!user) return;
                    this.selfServiceAccountBusy = true;
                    this.selfServiceAccountMessage = 'جارٍ حذف هوية الحساب وعضويته فقط. لا تُحذف بيانات المرضى أو الزيارات.';
                    try {
                        await this.callClinicAccountGateway('delete', user);
                    } catch (error) {
                        this.selfServiceAccountMessage = error?.message || 'تعذر حذف الحساب. بقيت البيانات دون تغيير.';
                        this.selfServiceAccountBusy = false;
                        return;
                    }
                    this.users = this.users.filter(u => u.id !== userId);
                    delete this.userPermissionDrafts[userId];
                    this.persistState();
                    const cloudResult = await this.persistUsersToCloudNow();
                    if (navigator.onLine && this.cloudSyncEnabled && !cloudResult.ok) {
                        this.selfServiceAccountMessage = 'حُذفت هوية الحساب وعضويته، وستُعاد مزامنة القائمة المحلية تلقائياً عند استقرار الاتصال.';
                    } else {
                        this.selfServiceAccountMessage = 'تم حذف حساب الفريق وعضويته فقط. بيانات المرضى والزيارات لم تُمس.';
                    }
                    this.selfServiceAccountBusy = false;
                },

                async toggleUserActive(userId) {
                    if (userId === 1) {
                        alert('لا يمكن إيقاف حساب المدير الأساسي');
                        return;
                    }
                    const user = this.users.find(u => u.id === userId);
                    if (!user) return;
                    const previousActive = user.active;
                    user.active = !user.active;
                    const updated = await this.syncUserMembership(userId, { silent: true });
                    if (!updated) user.active = previousActive;
                    this.persistState();
                },

                async promoteToAdmin(userId) {
                    const user = this.users.find(u => u.id === userId);
                    if (!user) return;
                    if (!confirm(`هل تريد منح "${user.fullName}" صلاحيات إدارة كاملة (مدير آخر)؟`)) return;
                    const previousRole = user.role;
                    const previousPermissions = { ...user.permissions };
                    user.role = 'admin';
                    const fullPermissions = {};
                    this.permissionModules.forEach(m => { fullPermissions[m.key] = true; });
                    user.permissions = fullPermissions;
                    this.userPermissionDrafts[userId] = { ...fullPermissions };
                    const updated = await this.syncUserMembership(userId, { silent: true });
                    if (!updated) {
                        user.role = previousRole;
                        user.permissions = previousPermissions;
                        this.userPermissionDrafts[userId] = { ...previousPermissions };
                        this.persistState();
                        return;
                    }
                    this.persistState();
                },

                async saveUserPermissions(userId) {
                    const user = this.users.find(u => u.id === userId);
                    if (!user) return;
                    const fullPermissions = {};
                    this.permissionModules.forEach(m => { fullPermissions[m.key] = true; });
                    user.permissions = user.id === 1 || user.role === 'admin'
                        ? fullPermissions
                        : { ...this.userPermissionDrafts[userId] };
                    this.userPermissionDrafts[userId] = { ...user.permissions };
                    if (this.currentUser && this.currentUser.id === userId) {
                        this.currentUser = user;
                    }
                    this.userSaveFeedback[userId] = true;
                    setTimeout(() => { this.userSaveFeedback[userId] = false; }, 2000);
                    this.persistState();
                    const cloudResult = await this.persistUsersToCloudNow();
                    if (navigator.onLine && this.cloudSyncEnabled && !cloudResult.ok) {
                        alert('تم تعديل الصلاحيات محلياً فقط ولم يؤكَّد حفظها في السحابة.');
                    }
                },

                // Maps each page to the permission required to view it, so navigation can never
                // land an employee on a section outside what the admin granted them.
                // 'patientForm' is intentionally excluded — it's reachable either via 'newVisit'
                // (adding a fresh visit) or via 'patients' (editing from the list); both call
                // openPatientFormPage()/startEditPatient() directly rather than navigateTo().
                viewPermissionMap: {
                    dashboard: 'dashboard',
                    newVisit: 'newVisit',
                    followUps: 'followUps',
                    waitingQueue: 'waitingQueue',
                    appointments: 'appointments',
                    patientsList: 'patients',
                    medicalRecord: 'patients',
                    invoices: 'invoices',
                    expenses: 'expenses',
                    reports: 'reports',
                    pharmacy: 'pharmacy',
                    prescriptionSettings: 'prescriptionSettings',
                    settings: 'settings'
                },

                // Lands the given user on the first section they have access to. Some permission
                // entries (like "newVisit") aren't real pages — they're direct-action shortcuts —
                // so they need to trigger their action instead of setting an invalid currentView.
                landOnAllowedPage(user) {
                    const firstAllowed = this.permissionModules.find(m => user.permissions[m.key]);
                    if (!firstAllowed) { this.currentView = 'dashboard'; return; }
                    if (firstAllowed.key === 'newVisit') {
                        this.openPatientFormPage();
                    } else if (firstAllowed.key === 'waitingQueue') {
                        this.currentView = 'waitingQueue';
                    } else {
                        this.currentView = firstAllowed.key;
                    }
                },

                firebaseEmailForUser(value) {
                    const normalized = (value || '').trim().toLowerCase();
                    if (normalized.includes('@')) return normalized;
                    const safeLocalPart = Array.from(normalized)
                        .map(character => /[a-z0-9._+-]/.test(character)
                            ? character
                            : `u${character.codePointAt(0).toString(16)}`)
                        .join('-')
                        .replace(/-+/g, '-')
                        .replace(/^-|-$/g, '') || 'user';
                    return `${safeLocalPart}@solimedical.local`;
                },

                async createFirebaseIdentityForNewUser(localUser) {
                    if (!firebase || !firebaseAuth || !navigator.onLine) {
                        localUser.firebaseAuthStatus = 'not_provisioned';
                        return { ok: false, deferred: true };
                    }
                    const password = String(localUser?.password || '');
                    if (password.length < 6) {
                        localUser.firebaseAuthStatus = 'password_update_required';
                        return { ok: false, message: 'كلمة مرور Firebase يجب أن تكون 6 أحرف أو أرقام على الأقل.' };
                    }
                    const firebaseEmail = this.firebaseEmailForUser(localUser.email);
                    const secondaryName = `secondary-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
                    let secondaryApp = null;
                    try {
                        secondaryApp = firebase.initializeApp(firebaseConfig, secondaryName);
                        const secondaryAuth = secondaryApp.auth();
                        let credential;
                        try {
                            credential = await secondaryAuth.createUserWithEmailAndPassword(firebaseEmail, password);
                        } catch (createError) {
                            if (!String(createError?.code || '').includes('email-already-in-use')) throw createError;
                            credential = await secondaryAuth.signInWithEmailAndPassword(firebaseEmail, password);
                        }
                        localUser.firebaseUid = credential.user?.uid || localUser.firebaseUid || '';
                        localUser.firebaseAuthStatus = 'membership_pending';
                        return { ok: true, uid: localUser.firebaseUid };
                    } catch (error) {
                        localUser.firebaseAuthStatus = 'not_provisioned';
                        return { ok: false, message: this.firebaseIdentityErrorMessage(error) };
                    } finally {
                        if (secondaryApp) await secondaryApp.delete().catch(() => {});
                    }
                },

                get firebaseMigrationUser() {
                    return this.users.find(u => String(u.id) === String(this.firebaseMigrationUserId)) || null;
                },

                get firebaseMigrationEmail() {
                    return this.firebaseMigrationUser ? this.firebaseEmailForUser(this.firebaseMigrationUser.email) : '';
                },

                openAppointmentsPage(date = null) {
                    const user = this.currentUser ? this.withCompatiblePermissions(this.currentUser) : null;
                    if (user) this.currentUser = user;
                    const permissions = user?.permissions || {};
                    const canOpen = user?.role === 'admin' || permissions.appointments || permissions.waitingQueue;
                    if (!canOpen) {
                        this.landOnAllowedPage(user);
                        this.mobileMenuOpen = false;
                        return;
                    }
                    this.selectedAppointmentDate = date || this.selectedAppointmentDate || new Date().toISOString().slice(0, 10);
                    this.appointmentForm.date = this.selectedAppointmentDate;
                    // تعيين الصفحة مباشرة يمنع أي حالة صلاحيات قديمة من إعادة التوجيه
                    // إلى لوحة التحكم أثناء تحديث currentUser من Firestore.
                    this.currentView = 'appointments';
                    localStorage.setItem('soliLastSection', 'appointments');
                    this.mobileMenuOpen = false;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    this.$nextTick(() => {
                        this.renderBookingShareQr();
                        this.renderIcons();
                    });
                },
                navigateTo(view, options = {}) {
                    const requiredPermission = this.viewPermissionMap[view];
                    const compatibleUser = this.currentUser ? this.withCompatiblePermissions(this.currentUser) : null;
                    if (compatibleUser) this.currentUser = compatibleUser;
                    const legacyAppointmentsAccess = view === 'appointments' && (compatibleUser?.role === 'admin' || compatibleUser?.permissions?.waitingQueue);
                    if (compatibleUser && requiredPermission && !compatibleUser.permissions[requiredPermission] && !legacyAppointmentsAccess) {
                        // Not allowed here — send them to the first section they DO have access to.
                        this.landOnAllowedPage(this.currentUser);
                        this.mobileMenuOpen = false;
                        return;
                    }
                    const previousView = this.currentView;
                    if (!options.replace && previousView && previousView !== view) {
                        this.navigationHistory.push(previousView);
                        this.navigationHistory = this.navigationHistory.slice(-20);
                    }
                    this.currentView = view;
                    if (view === 'settings') {
                        this.$nextTick(() => document.querySelectorAll('.settings-accordion[open]').forEach(card => card.removeAttribute('open')));
                    }
                    this.mobileMenuOpen = false;
                    localStorage.setItem('soliLastSection', view);
                    if (options.scroll !== false) window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                goBack() {
                    const fallback = 'dashboard';
                    let target = this.navigationHistory.pop();
                    while (target && this.viewPermissionMap[target] && !this.currentUser?.permissions?.[this.viewPermissionMap[target]]) {
                        target = this.navigationHistory.pop();
                    }
                    this.navigateTo(target || fallback, { replace: true });
                },

                        patientsList: 'سجل إدارات المرضى والملفات الطبية',

                },
                get appointmentsForSelectedDay() {
                    const query = String(this.appointmentSearch || '').trim().toLowerCase();
                    return (this.appointments || []).filter(item => {
                        const matchesDate = item.date === this.selectedAppointmentDate;
                        const matchesArchive = this.showArchivedAppointments ? Boolean(item.archivedAt) : !item.archivedAt;
                        const haystack = [item.patientName, item.phone, item.visitType, item.notes].filter(Boolean).join(' ').toLowerCase();
                        const matchesQuery = !query || haystack.includes(query);
                        const matchesStatus = this.appointmentStatusFilter === 'all' || (item.status || 'scheduled') === this.appointmentStatusFilter;
                        return matchesDate && matchesArchive && matchesQuery && matchesStatus;
                    }).sort((a, b) => String(a.time || '').localeCompare(String(b.time || '')));
                },
                get archivedAppointmentCount() {
                    return (this.appointments || []).filter(item => Boolean(item.archivedAt)).length;
