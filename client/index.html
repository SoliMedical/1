    <script>
        // إعداد Firebase يُحمّل من firebase-config.js لكي يحصل كل عميل على مشروع مستقل.
        // حسابات الدخول والصلاحيات تبقى محلية داخل Soli Medical؛ Firebase للمزامنة الصامتة فقط.
        const firebaseConfig = window.SOLI_FIREBASE_CONFIG || {};
        const clinicAccountGatewayUrl = String(window.SOLI_CLINIC_ACCOUNT_GATEWAY_URL || '').trim();

        // لا تبدأ المزامنة إلا مع إعداد Firebase فعلي؛ وإلا يعمل النظام بالبيانات المحلية فقط.
        const isFirebaseConfigured = Boolean(firebaseConfig.apiKey && firebaseConfig.apiKey !== 'YOUR_API_KEY');
        const isPublicBookingUrl = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                return params.has('book') || window.location.hash.replace(/^#/, '') === 'book';
            } catch (error) {
                return false;
            }
        };
        const isPublicPricingUrl = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                return params.has('pricing') || window.location.hash.replace(/^#/, '') === 'pricing';
            } catch (error) {
                return false;
            }
        };
        const publicBookingMode = isPublicBookingUrl();
        const publicPricingMode = isPublicPricingUrl();
        // رقم الإصدار الظاهر للمستخدم للتأكد من أن المتصفح حمّل آخر نسخة منشورة.
        const SOLI_APP_VERSION = 'v1.7.7';
        const SOLI_APP_RELEASE = 'إدارة ذاتية آمنة لحسابات فريق العيادة عبر مسار إداري موثوق';

        // يقبل رقم محمول مصري محلياً أو بصيغة دولية، ويعيده دائماً كرقم محلي من 11 رقماً.
        // الأرقام الثابتة أو أرقام الدول الأخرى لا تُحفظ ضمن بيانات التواصل في Soli Medical.
        const validateEgyptianPhone = (value) => {
            const westernDigits = String(value || '')
                .replace(/[٠-٩]/g, digit => '٠١٢٣٤٥٦٧٨٩'.indexOf(digit))
                .replace(/[۰-۹]/g, digit => '۰۱۲۳۴۵۶۷۸۹'.indexOf(digit));
            let normalized = westernDigits.replace(/\D/g, '');
            if (normalized.startsWith('00')) normalized = normalized.slice(2);
            if (normalized.startsWith('20')) normalized = '0' + normalized.slice(2);
            return /^01(?:0|1|2|5)\d{8}$/.test(normalized) ? normalized : null;
        };
        const normalizeEgyptianPhone = (value) => validateEgyptianPhone(value);

        let firebaseAuth = null;
        let firestoreDB = null;
        let firebaseStorage = null;

        if (isFirebaseConfigured && !publicBookingMode && !publicPricingMode) {
            firebase.initializeApp(firebaseConfig);
            firebaseAuth = firebase.auth();
            firestoreDB = firebase.firestore();
            firebaseStorage = firebase.storage();
            // Built-in offline cache: Firestore keeps working (reads + writes queued) with no
            // internet, and syncs automatically the moment the connection returns.
            firestoreDB.enablePersistence({ synchronizeTabs: true }).catch(err => {
                console.warn('تعذر تفعيل التخزين المؤقت لـ Firestore:', err.code);
            });
        }

        const initializeArabicDatePickers = (root = document, language = window.SoliInterface?.getStoredLanguage?.() || 'ar', force = false) => {
            if (!window.flatpickr) return;
            const dateInputs = root.querySelectorAll ? root.querySelectorAll('input.soli-date-input[type="date"], input.soli-date-input[type="month"]') : [];
            dateInputs.forEach(input => {
                const isEnglish = language === 'en';
                if (input._flatpickr && !force && input.dataset.soliDateLocale === language) return;
                const isMonthPicker = input.type === 'month';
                try {
                    if (input._flatpickr) input._flatpickr.destroy();
                    window.flatpickr(input, {
                        locale: isEnglish ? 'default' : window.flatpickr.l10ns?.ar,
                        disableMobile: true,
                        allowInput: false,
                        dateFormat: isMonthPicker ? 'Y-m' : 'Y-m-d',
                        altInput: !isEnglish,
                        altFormat: isMonthPicker ? 'F Y' : 'j F Y',
                        monthSelectorType: 'static',
                        onReady: (_selectedDates, _dateString, instance) => {
                            instance.calendarContainer.classList.toggle('soli-arabic-calendar', !isEnglish);
                            const visibleInput = instance.altInput || instance.input;
                            visibleInput.setAttribute('aria-label', input.getAttribute('aria-label') || (isEnglish ? 'Choose date' : 'اختيار التاريخ'));
                            visibleInput.setAttribute('dir', isEnglish ? 'ltr' : 'rtl');
                            visibleInput.setAttribute('lang', isEnglish ? 'en-GB' : 'ar-EG');
                        },
                        onChange: (_selectedDates, dateString, instance) => {
                            // يبقى x-model مرتبطاً بالحقل الأصلي بصيغة ISO، مع عرض عربي واضح في الحقل البديل.
                            instance.input.value = dateString;
                            instance.input.dispatchEvent(new Event('input', { bubbles: true }));
                            instance.input.dispatchEvent(new Event('change', { bubbles: true }));
                        }
                    });
                    input.dataset.soliDateLocale = language;
                } catch (error) {
                    console.warn('تعذر تهيئة منتقي التاريخ:', error);
                }
            });
        };

        // حقول البحث ليست بيانات اعتماد. نعيد تثبيت هذه الخصائص عند التحميل وكلما
        // أضاف Alpine حقولاً جديدة، حتى لا يعاملها المتصفح أو مدير كلمات المرور كحقول دخول.
        const initializeSearchFieldProtections = (root = document) => {
            const searchInputs = root.querySelectorAll
                ? root.querySelectorAll('input.soli-search-input, input[type="search"]')
                : [];
            searchInputs.forEach((input, index) => {
                input.type = 'search';
                input.setAttribute('autocomplete', 'off');
                input.setAttribute('autocapitalize', 'none');
                input.setAttribute('autocorrect', 'off');
                input.setAttribute('spellcheck', 'false');
                input.setAttribute('data-form-type', 'other');
                input.setAttribute('data-lpignore', 'true');
                input.setAttribute('data-1p-ignore', 'true');
                input.setAttribute('data-bwignore', 'true');
                input.setAttribute('data-protonpass-ignore', 'true');
                input.setAttribute('data-soli-search', 'true');
                if (!input.name) input.name = `soli-search-${index + 1}`;
                const form = input.closest('form');
                if (form) form.setAttribute('autocomplete', 'off');
            });
        };

        document.addEventListener('alpine:initialized', () => {
            window.setTimeout(() => {
                initializeArabicDatePickers();
                initializeSearchFieldProtections();
                let initializationQueued = false;
                const interfaceObserver = new MutationObserver(() => {
                    if (initializationQueued) return;
                    initializationQueued = true;
                    window.setTimeout(() => {
                        initializationQueued = false;
                        initializeArabicDatePickers();
                        initializeSearchFieldProtections();
                    }, 0);
                });
                interfaceObserver.observe(document.body, { childList: true, subtree: true });
                document.addEventListener('focusin', event => {
                    if (event.target instanceof HTMLInputElement && (event.target.matches('input.soli-search-input') || event.target.type === 'search')) {
                        initializeSearchFieldProtections(document);
                    }
                });
            }, 0);
        });

            Alpine.data('bookingApp', () => ({

                sendError: '',

                    phone: '',
                    date: new Date().toISOString().slice(0, 10),

                init() {
                    const params = new URLSearchParams(window.location.search);
                    this.doctorName = String(params.get('doctor') || 'فريق Soli Medical').trim();
                    this.specialty = String(params.get('specialty') || 'حجز موعد طبي').trim();
                    this.clinicName = String(params.get('clinic') || 'العيادة').trim();
                    this.receptionPhone = this.normalizePhone(params.get('reception') || params.get('phone') || '');
                    document.title = `حجز موعد | ${this.clinicName}`;
                    this.$nextTick(() => window.lucide?.createIcons());
                },

                normalizePhone(value) {
                    const localPhone = normalizeEgyptianPhone(value);
                    return localPhone ? `20${localPhone.slice(1)}` : '';
                },

                buildWhatsAppMessage() {
                    const form = this.bookingForm;
                    return [
                        'طلب حجز موعد جديد',
                        `الاسم: ${String(form.name || '').trim()}`,
                        `الهاتف: ${String(form.phone || '').trim()}`,
                        `التاريخ المطلوب: ${form.date || ''}`,
                        `الوقت المفضل: ${form.time || ''}`,
                        `نوع الزيارة: ${form.visitType || 'كشف'}`,
                        `ملاحظات: ${String(form.notes || '').trim() || 'لا توجد'}`,
                        'الحالة المطلوبة: بانتظار التأكيد'
                    ].join('\n');
                },

                submitBooking() {
                    const form = this.bookingForm;
                    const phone = this.normalizePhone(form.phone);
                    if (!String(form.name || '').trim() || !form.date || !form.time) {
                        this.sendError = 'يرجى كتابة الاسم والتاريخ والوقت قبل المتابعة.';
                        return;
                    }
                    if (!phone) {
                        this.sendError = 'رقم الهاتف غير صحيح. أدخل رقم محمول مصري صحيحاً من 11 رقماً، مثل: 01012345678.';
                        return;
                    }
                    if (!this.receptionPhone) {
                        this.sendError = 'رقم استقبال العيادة غير متاح في هذا الرابط. يرجى طلب رابط الحجز من الاستقبال.';
                        return;
                    }
                    form.phone = phone;
                    this.sendError = '';
                    this.whatsappUrl = `https://wa.me/${this.receptionPhone}?text=${encodeURIComponent(this.buildWhatsAppMessage())}`;
                    window.open(this.whatsappUrl, '_blank', 'noopener');
                    this.sent = true;
                }
            }));

                    const currentId = String(this.currentUser.id ?? '');

                    const freshUser = this.users.find(user =>
                        (currentId && String(user.id ?? '') === currentId) ||
                        (currentEmail && String(user.email || '').trim().toLowerCase() === currentEmail)

                withCompatiblePermissions(user) {
                    if (!user) return user;
                    const permissions = { ...(user.permissions || {}) };
                    if (user.role === 'admin' || user.id === 1 || String(user.id) === '1') {
                        this.permissionModules.forEach(module => { permissions[module.key] = true; });
                    } else if (permissions.appointments === undefined) {
                        permissions.appointments = Boolean(permissions.waitingQueue);
                    }
                    return { ...user, permissions };
                },
                normalizeUsers(users) {
                    const source = Array.isArray(users) ? users : [];
                    const result = [];
                    const indexesById = new Map();
                    const indexesByEmail = new Map();
                    const choosePreferredUser = (current, candidate) => {
                        if (!current) return candidate;
                        const currentIsPrimaryAdmin = String(current.id) === '1' && current.role === 'admin';
                        const candidateIsPrimaryAdmin = String(candidate.id) === '1' && candidate.role === 'admin';
                        return candidateIsPrimaryAdmin && !currentIsPrimaryAdmin ? candidate : current;
                    };
                    source.forEach(rawUser => {
                        if (!rawUser || !rawUser.email) return;
                        const user = this.withCompatiblePermissions({
                            ...rawUser,
                            email: String(rawUser.email).trim(),
                            ...(rawUser.password ? { password: String(rawUser.password) } : {})
                        });
                        const emailKey = user.email.toLowerCase();
                        const idKey = user.id === undefined || user.id === null ? '' : String(user.id);
                        const existingIndex = (idKey && indexesById.has(idKey)) ? indexesById.get(idKey) : indexesByEmail.get(emailKey);
                        if (existingIndex === undefined) {
                            const index = result.push(user) - 1;
                            if (idKey) indexesById.set(idKey, index);
                            indexesByEmail.set(emailKey, index);
                            return;
                        }
                        const preferred = choosePreferredUser(result[existingIndex], user);
                        result[existingIndex] = preferred;
                        if (preferred.email) indexesByEmail.set(preferred.email.toLowerCase(), existingIndex);
                        if (preferred.id !== undefined && preferred.id !== null) indexesById.set(String(preferred.id), existingIndex);
                    });

                    if ((this.syncConflicts || []).some(item => item.key === conflictKey)) return;
                    const recoveryAvailable = this.saveConflictRecoverySnapshot(localSnapshot, remoteMeta);
                    this.syncConflicts = [{

                        key: conflictKey,
                        detectedAt: new Date().toISOString(),
                        localUser: this.currentUser?.fullName || 'المستخدم المحلي',

                        localSummary: this.getSyncDataSummary(localSnapshot),

                    this.isLoadingMedicineArchive = true;
                    this.medicineArchiveMessage = 'جارٍ تحميل أرشيف الأدوية المصري للبحث العربي والإنجليزي...';
                    const sourceUrl = 'https://raw.githubusercontent.com/karem505/egyptian-drug-database/main/data/egyptian-drugs.json';
                    try {
                        const cached = sessionStorage.getItem('soliMedicalEgyptianMedicineArchive');
                        const raw = cached ? JSON.parse(cached) : await fetch(sourceUrl, { cache: 'force-cache' }).then(response => {
                            if (!response.ok) throw new Error(`HTTP ${response.status}`);
                            return response.json();
                        });
                        const records = Array.isArray(raw) ? raw : (Array.isArray(raw?.data) ? raw.data : []);
                        this.egyptianMedicineArchive = records.map((item, index) => ({
                            id: item.id || `eg-med-${index}`,
                            arabicName: String(item.commercial_name_ar || '').trim(),
                            englishName: String(item.commercial_name_en || '').trim(),
                            scientificName: String(item.scientific_name || '').trim(),
                            manufacturer: String(item.manufacturer || '').trim(),
                            drugClass: String(item.drug_class || '').trim(),
                            route: String(item.route || '').trim(),
                            price: item.price_egp ?? ''
                        })).filter(item => item.arabicName || item.englishName || item.scientificName);
                        try {
                            sessionStorage.setItem('soliMedicalEgyptianMedicineArchive', JSON.stringify(this.egyptianMedicineArchive));
                        } catch (storageError) {
                            console.warn('تعذر حفظ أرشيف الأدوية في ذاكرة الجلسة:', storageError);
                        }
                        this.egyptianMedicineArchiveLoaded = true;
                        this.medicineArchiveMessage = `تم تحميل ${this.egyptianMedicineArchive.length.toLocaleString('ar-EG')} صنفاً للبحث.`;
                    } catch (error) {
                        console.warn('تعذر تحميل أرشيف الأدوية المصري:', error);
                        this.medicineArchiveMessage = 'تعذر تحميل الأرشيف حالياً؛ يمكنك استخدام القائمة المحلية أو كتابة دواء مخصص.';
                    } finally {
                        this.isLoadingMedicineArchive = false;
                    }
                },

                observeFirebaseAuth() {
                    if (!firebaseAuth) return;
                    firebaseAuth.onAuthStateChanged(user => {
                        this.authError = '';
                        if (user) {
                            const permanentIdentity = this.isPermanentFirebaseUser(user);
                            this.cloudAuthReady = permanentIdentity;
                            this.cloudMembershipReady = false;
                            this.firebaseIdentityUid = user.uid || '';
                            this.firebaseIdentityEmail = user.email || '';
                            this.firebaseIdentityStatus = user.isAnonymous ? 'احتياطي مؤقت' : 'هوية دائمة متصلة';
                            if (user.isAnonymous) {
                                this.firebaseIdentityMessage = this.firebaseIdentityIssueCode
                                    ? this.firebaseIdentityErrorMessage({ code: this.firebaseIdentityIssueCode })
                                    : 'تعمل المزامنة المؤقتة، لكن لا يمكن تطبيق قواعد العضوية الحية بهذه الجلسة.';
                            } else {
                                this.firebaseIdentityIssueCode = '';
                                this.firebaseIdentityMessage = 'تم التحقق من هوية Firebase الدائمة لهذا الجهاز.';
                            }
                            if (!permanentIdentity) {
                                this.cloudStatus = 'offline';
                                this.stopV2OperationalSync();
                                return;
                            }
                            this.cloudStatus = navigator.onLine ? 'connecting' : 'offline';
                            const expectedUid = user.uid;
                            this.refreshFirebaseMembershipStatus(user).then(isActiveMember => {
                                if (firebaseAuth?.currentUser?.uid !== expectedUid) return;
                                this.cloudMembershipReady = Boolean(isActiveMember);
                                // A permanent identity plus a server-verified active membership is
                                // sufficient evidence that Firestore is reachable. Loading the 11
                                // operational collections remains a separate health concern, so a
                                // transient issue in one empty/secondary collection must not make
                                // the whole clinic appear offline.
                                this.cloudStatus = isActiveMember && navigator.onLine ? 'online' : 'offline';
                                if (isActiveMember) this.startCloudSync();
                                else this.stopV2OperationalSync();
                            });
                            return;
                        }
                        this.cloudAuthReady = false;
                        this.cloudMembershipReady = false;
                        this.firebaseIdentityUid = '';
                        this.firebaseIdentityEmail = '';
                        this.firebaseIdentityStatus = 'غير متصل';
                        this.firebaseMembershipStatus = 'غير مفحوصة';
                        this.firebaseMembershipRole = '';
                        if (this.cloudUnsubscribe) {
                            this.cloudUnsubscribe();
                            this.cloudUnsubscribe = null;
                        }
                        this.stopV2OperationalSync();
                        if (!this.isAuthenticated) this.cloudStatus = 'offline';
                    });
                },

                startCloudSync() {
                    if (this.cloudUnsubscribe || !this.cloudAuthReady || !this.cloudMembershipReady || !firestoreDB) {
                        if (!firestoreDB) this.cloudStatus = 'offline';
                        return;
                    }
                    if (this.isOperationalDocumentSyncActive()) {
                        this.cloudStatus = navigator.onLine ? 'connecting' : 'offline';
                        this.startV2OperationalSync();
                        return;
                    }
                    const docRef = firestoreDB.doc(this.cloudDocPath);
                    this.cloudUnsubscribe = docRef.onSnapshot(
                        { includeMetadataChanges: true },
                        (snap) => {
                            this.cloudStatus = snap.metadata.hasPendingWrites ? 'syncing' : (snap.metadata.fromCache ? 'offline' : 'online');
                            // First protected sync: the first authenticated device establishes
                            // the shared clinic snapshot, including data created while offline.
                            if (!snap.exists) {
                                if (!this.localChangesPending) {
                                    this.localEditBaseRevision = 0;
                                    this.localChangesPending = true;
                                }
                                this.queueCloudSync();
                                return;
                            }
                            // Ignore the echo of our own write coming back from the server.
                            if (snap.metadata.hasPendingWrites) return;
                            const data = snap.data();
                            const remoteMeta = data._syncMeta || {};
                            // Storage URLs are small and safe to mirror through the legacy
                            // document during the transition. A legacy Base64 logo is read only
                            // for compatibility, then can be migrated explicitly by the admin.
                            if (typeof data.clinicLogoUrl === 'string' && data.clinicLogoUrl) {
                                this.clinicLogoUrl = data.clinicLogoUrl;
                            }
                            if (typeof data.clinicLogoStoragePath === 'string' && data.clinicLogoStoragePath) {
                                this.clinicLogoStoragePath = data.clinicLogoStoragePath;
                            }
                            if (!this.clinicLogoUrl && !this.clinicLogoDataUrl && typeof data.clinicLogoDataUrl === 'string') {
                                this.clinicLogoDataUrl = data.clinicLogoDataUrl;
                            }
                            if (Array.isArray(data.users) && !this.usersWriteInFlight && !this.usersLocalChangesPending) {
                                this.users = this.mergeCloudUsersWithLocalCredentials(data.users);
                                this.syncCurrentUserFromUsers();
                                this.persistState();
                            }
                            const remoteRevision = Number(remoteMeta.revision || 0);
                            const preservePendingLocalSnapshot = this.localChangesPending;
                            const hasForeignPendingConflict = preservePendingLocalSnapshot &&
                                remoteMeta.writerId && remoteMeta.writerId !== this.syncDeviceId &&
                                remoteRevision > Number(this.localEditBaseRevision || 0);
                            const localSnapshot = preservePendingLocalSnapshot ? this.getSyncDataSnapshot() : null;
                            const verifiedRemoteMigration = data?.dataMigration?.status === 'completed' &&
                                Boolean(data?.dataMigration?.migrationId);
                            const operationalDocumentStore = verifiedRemoteMigration || this.isOperationalDocumentSyncActive();
                            this.applyingRemoteUpdate = true;
                            this.syncRevision = remoteRevision;
                            this.persistentKeys.forEach(key => {
                                // لا تسمح لنسخة محلية أقدم أن تعكس حالة ترحيل تم التحقق منها
                                // إدارياً. يبقى كل من الدخول المحلي ومصدر القراءة كما هما.
                                if (key === 'dataMigration' && verifiedRemoteMigration) {
                                    this.dataMigration = data.dataMigration;
                                // Once the administrative verification has completed, medical
                                // and configuration records are hydrated from their V2 documents.
                                // The old document is preserved untouched as a recovery copy.
                                } else if (operationalDocumentStore && this.isV2OperationalKey(key)) {
                                    return;
                                // Local changes always win until their queued cloud write
                                // completes. This prevents delayed remote snapshots from
                                // erasing local fields or interrupting active text entry.
                                } else if (preservePendingLocalSnapshot && localSnapshot?.[key] !== undefined) {
                                    this[key] = localSnapshot[key];
                                } else if (key === 'users' && Array.isArray(data.users)) {
                                    this.users = this.mergeCloudUsersWithLocalCredentials(data.users);
                                    this.syncCurrentUserFromUsers();
                                } else if (data[key] !== undefined) {
                                    this[key] = data[key];
                                }
                            });
                            this.persistState();
                            this.renderIcons();
                            this.localChangesPending = preservePendingLocalSnapshot;
                            this.localEditBaseRevision = remoteRevision;
                            this.$nextTick(() => {
                                this.applyingRemoteUpdate = false;
                                if (hasForeignPendingConflict) {
                                    this.recordSyncConflict(data, remoteMeta, 'وصل تعديل من جهاز آخر أثناء وجود تغييرات محلية لم تُرفع بعد؛ تم تسجيل تفاصيل التعارض.', localSnapshot);
                                }
                                if (operationalDocumentStore) this.startV2OperationalSync();
                                if (preservePendingLocalSnapshot) this.queueCloudSync();
                            });
                        },
                        (err) => {
                            console.error('خطأ في مزامنة Firestore:', err);
                            this.cloudStatus = 'offline';
                            this.scheduleCloudRetry();
                        }
                    );
                },

                scheduleCloudRetry() {
                    if (!this.cloudSyncEnabled || !this.cloudAuthReady || !this.localChangesPending) return;
                    clearTimeout(this.cloudRetryTimer);
                    this.cloudRetryAttempts = Math.min(Number(this.cloudRetryAttempts || 0) + 1, 5);
                    const delay = Math.min(30000, 1000 * (2 ** this.cloudRetryAttempts));
                    this.cloudRetryTimer = setTimeout(() => {
                        if (navigator.onLine && this.cloudAuthReady && this.localChangesPending) this.queueCloudSync();
                    }, delay);
                },

                async waitForCloudAuthReady(timeoutMs = 10000) {
                    if (!this.cloudSyncEnabled || !firestoreDB || !navigator.onLine || !firebaseAuth) return false;
                    if (!this.cloudAuthListenerStarted) {
                        this.cloudAuthListenerStarted = true;
                        this.observeFirebaseAuth();
                    }
                    try {
                        const currentIdentity = firebaseAuth.currentUser;
                        if (!this.isPermanentFirebaseUser(currentIdentity)) {
                            await this.signInFirebaseForLocalUser(this.currentUser, { allowAnonymousFallback: false, createIfMissing: true });
                        }
                    } catch (error) {
                        console.warn('تعذر تجهيز هوية Firebase قبل حفظ الحسابات:', error);
                        return false;
                    }
                    const startedAt = Date.now();
                    while (!this.cloudAuthReady && Date.now() - startedAt < timeoutMs) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                    if (this.cloudAuthReady && this.cloudMembershipReady) this.startCloudSync();
                    return Boolean(this.cloudAuthReady && this.cloudMembershipReady);
                },

                async persistUsersToCloudNow() {
                    this.usersLocalChangesPending = true;
                    this.usersChangeSequence = Number(this.usersChangeSequence || 0) + 1;
                    if (!this.cloudSyncEnabled || !firestoreDB || !navigator.onLine) {
                        this.persistState();
                        return { ok: false, deferred: true };
                    }
                    if (!(await this.waitForCloudAuthReady())) return { ok: false, deferred: false };
                    clearTimeout(this.cloudSyncTimer);
                    const docRef = firestoreDB.doc(this.cloudDocPath);
                    const writeSequence = Number(this.syncChangeSequence || 0);
                    this.users = this.normalizeUsers(this.users);
                    this.syncCurrentUserFromUsers();
                    const usersWriteSequence = Number(this.usersChangeSequence || 0);
                    const localUsers = this.getCloudSafeUsers(this.users);
                    this.cloudStatus = 'syncing';
                    this.usersWriteInFlight = true;
                    try {
                        const result = await firestoreDB.runTransaction(async transaction => {
                            const snap = await transaction.get(docRef);
                            const remoteData = snap.exists ? snap.data() : {};
                            const remoteMeta = remoteData._syncMeta || {};
                            const revision = Number(remoteMeta.revision || 0) + 1;
                            transaction.set(docRef, {
                                users: localUsers,
                                _syncMeta: {
                                    ...remoteMeta,
                                    revision,
                                    writerId: this.syncDeviceId,
                                    writerName: this.currentUser?.fullName || 'مدير النظام',
                                    updatedAt: new Date().toISOString()
                                }
                            }, { merge: true });
                            return { revision };
                        });
                        this.syncRevision = result.revision;
                        this.localEditBaseRevision = result.revision;
                        const changedDuringWrite = Number(this.syncChangeSequence || 0) !== writeSequence;
                        this.localChangesPending = changedDuringWrite;
                        this.cloudStatus = 'online';
                        this.cloudRetryAttempts = 0;
                        this.usersLocalChangesPending = Number(this.usersChangeSequence || 0) !== usersWriteSequence;
                        if (this.localChangesPending) this.queueCloudSync();
                        return { ok: true, deferred: false };
                    } catch (error) {
                        console.error('تعذر حفظ قائمة الحسابات مباشرة في Firestore:', error);
                        this.cloudStatus = 'offline';
                        this.localChangesPending = true;
                        this.usersLocalChangesPending = true;
                        this.scheduleCloudRetry();
                        return { ok: false, deferred: false, error };
                    } finally {
                        this.usersWriteInFlight = false;
                    }
                },

                // Debounced push so rapid local edits (typing, checkbox toggles) don't spam Firestore.
                queueCloudSync() {
                    if (!this.cloudSyncEnabled || !this.cloudAuthReady || this.applyingRemoteUpdate || this.doctorInfoEditing || !firestoreDB) return;
                    clearTimeout(this.cloudSyncTimer);
                    this.cloudSyncTimer = setTimeout(() => {
                        if (this.isOperationalDocumentSyncActive()) this.pushStateToV2();
                        else this.pushStateToCloud();
                    }, 600);
                },

                pushStateToCloud() {
                    if (this.isOperationalDocumentSyncActive()) return this.pushStateToV2();
                    if (!this.cloudSyncEnabled || !this.cloudAuthReady || this.doctorInfoEditing || !firestoreDB || this.cloudWriteInFlight) return;
                    const dataToSave = this.getCloudSyncSnapshot();
                    const docRef = firestoreDB.doc(this.cloudDocPath);
                    const baseRevision = Number(this.localEditBaseRevision || this.syncRevision || 0);
                    const writeSequence = Number(this.syncChangeSequence || 0);
                    const writeMeta = {
                        revision: baseRevision + 1,
                        writerId: this.syncDeviceId,
                        writerName: this.currentUser?.fullName || 'المستخدم المحلي',
                        updatedAt: new Date().toISOString()
                    };
                    this.cloudStatus = 'syncing';
                    this.cloudWriteInFlight = true;
                    firestoreDB.runTransaction(async transaction => {
                        const snap = await transaction.get(docRef);
                        const remoteData = snap.exists ? snap.data() : {};
                        const remoteMeta = remoteData._syncMeta || {};
                        const remoteRevision = Number(remoteMeta.revision || 0);
                        const conflict = !!(snap.exists && remoteMeta.writerId && remoteMeta.writerId !== this.syncDeviceId && remoteRevision > baseRevision);
                        const revision = Math.max(remoteRevision, baseRevision) + 1;
                        transaction.set(docRef, {
                            ...dataToSave,
                            _syncMeta: { ...writeMeta, revision }
                        }, { merge: true });
                        return { revision, conflict: conflict ? { data: remoteData, meta: remoteMeta } : null };
                    }).then(result => {
                        this.syncRevision = result.revision;
                        const changedDuringWrite = Number(this.syncChangeSequence || 0) !== writeSequence;
                        this.localChangesPending = changedDuringWrite;
                        this.localEditBaseRevision = result.revision;
                        this.cloudStatus = 'online';
                        this.cloudRetryAttempts = 0;
                        this.queueV2MirroredChanges();
                        if (result.conflict) {
                            this.recordSyncConflict(result.conflict.data, result.conflict.meta, 'تم اكتشاف تعديل محفوظ من جهاز آخر قبل رفع التعديل المحلي؛ تم تسجيل تفاصيل التعارض.');
                        }
                    }).catch(err => {
                        console.error('تعذر رفع البيانات إلى Firestore (سيُعاد المحاولة تلقائياً عند عودة الاتصال):', err);
                        this.cloudStatus = 'offline';
                        this.scheduleCloudRetry();
                    }).finally(() => {
                        this.cloudWriteInFlight = false;
                        if (this.localChangesPending && navigator.onLine) this.queueCloudSync();
                    });
                },
                async pushStateToV2() {
                    if (!this.cloudSyncEnabled || !this.cloudAuthReady || this.doctorInfoEditing || !firestoreDB || this.cloudWriteInFlight) return;
                    const writeSequence = Number(this.syncChangeSequence || 0);
                    this.cloudStatus = 'syncing';
                    this.cloudWriteInFlight = true;
                    try {
                        const result = await this.flushV2MirroredChanges({ operationalWrite: true });
                        if (!result?.ok) {
                            const syncError = result?.error || new Error('تعذرت مزامنة وثائق V3.');
                            syncError.deferred = Boolean(result?.deferred);
                            throw syncError;
                        }
                        this.localChangesPending = Number(this.syncChangeSequence || 0) !== writeSequence;
                        this.cloudStatus = 'online';
                        this.cloudRetryAttempts = 0;
                    } catch (error) {
                        const authenticatedCloudSessionReady = Boolean(
                            navigator.onLine && this.cloudAuthReady && this.cloudMembershipReady
                        );
                        const schemaLabel = this.isTopLevelOperationalSyncActive() ? 'V3' : 'V2';
                        if (error?.deferred) {
                            console.info(`تم تأجيل مزامنة مجموعات Firestore ${schemaLabel} لأن دفعة أخرى أو التحقق من الهوية ما زال جارياً؛ ستستأنف تلقائياً.`, error);
                        } else {
                            console.error(`تعذر رفع البيانات إلى Firestore ${schemaLabel} (سيُعاد المحاولة تلقائياً):`, error);
                        }
                        // A failed or deferred data batch must not downgrade a verified Firebase
                        // identity and active clinic membership to a false local/offline state.
                        // The change remains local-first and is retried in the background.
                        this.cloudStatus = authenticatedCloudSessionReady ? 'online' : 'offline';
                        this.localChangesPending = true;
                        this.scheduleCloudRetry();
                    } finally {
                        this.cloudWriteInFlight = false;
                        if (this.localChangesPending && navigator.onLine) this.queueCloudSync();
                    }
                },

                // ---- FIRESTORE V2: CONTROLLED MULTI-DOCUMENT MIGRATION ----
                // The legacy shared document remains the active read/write source while V2 is
                // created and reconciled. These functions never delete the legacy document.
                getV2ClinicRef() {
                    if (!firestoreDB) throw new Error('Firestore غير متاح حالياً.');
                    return firestoreDB.collection('clinics').doc(String(this.cloudClinicId));
                },
                getV2Collection(name) {
                    return this.getV2ClinicRef().collection(name);
                },
                getTopLevelCollection(name) {
                    if (!firestoreDB) throw new Error('Firestore غير متاح حالياً.');
                    return firestoreDB.collection(String(name));
                },
                getTopLevelDocumentId(name, sourceDocumentId) {
                    const sourceId = this.safeFirestoreId(sourceDocumentId, `${name}-record`);
                    return this.safeFirestoreId(`${this.cloudClinicId}__${sourceId}`, `${name}-${sourceId}`);
                },
                getTopLevelMigrationState(migration = this.dataMigration) {
                    return migration?.topLevelCollections || {};
                },
                isTopLevelOperationalSyncActive(migration = this.dataMigration) {
                    const topLevel = this.getTopLevelMigrationState(migration);
                    return Boolean(topLevel?.status === 'completed' && topLevel?.migrationId && topLevel?.dualWriteEnabled !== false);
                },
                isOperationalDocumentSyncActive(migration = this.dataMigration) {
                    return this.isTopLevelOperationalSyncActive(migration) || this.isV2OperationalSyncActive(migration);
                },
                getOperationalCollectionQuery(name) {
                    return this.isTopLevelOperationalSyncActive()
                        ? this.getTopLevelCollection(name).where('clinicId', '==', String(this.cloudClinicId))
                        : this.getV2Collection(name);
                },
                sanitizeForFirestore(value) {
                    if (value === undefined) return null;
                    if (Array.isArray(value)) return value.map(item => this.sanitizeForFirestore(item));
                    if (value && typeof value === 'object') {
                        return Object.entries(value).reduce((result, [key, entry]) => {
                            if (entry !== undefined) result[key] = this.sanitizeForFirestore(entry);
                            return result;
                        }, {});
                    }
                    return value;
                },
                safeFirestoreId(value, fallback) {
                    const candidate = String(value || fallback || '').trim().replace(/\//g, '_');
                    return candidate || `generated-${Date.now()}-${Math.random().toString(36).slice(2)}`;
                },
                getMigrationCounts(state = this.getSyncDataSnapshot()) {
                    const patients = Array.isArray(state?.patients) ? state.patients : [];
                    return {
                        patients: patients.length,
                        visits: patients.reduce((total, patient) => total + (Array.isArray(patient?.records) ? patient.records.length : 0), 0),
                        appointments: Array.isArray(state?.appointments) ? state.appointments.length : 0,
                        invoices: Array.isArray(state?.invoices) ? state.invoices.length : 0,
                        prescriptions: Array.isArray(state?.prescriptions) ? state.prescriptions.length : 0,
                        expenses: Array.isArray(state?.expenses) ? state.expenses.length : 0,
                        waitingQueue: Array.isArray(state?.waitingQueue) ? state.waitingQueue.length : 0
                    };
                },
                buildV2MigrationOperations(state, migrationId, migratedAt = this.dataMigration?.lastCompletedAt || new Date().toISOString()) {
                    const operations = [];
                    const clinicRef = this.getV2ClinicRef();
                    const add = (collection, id, data) => operations.push({
                        ref: clinicRef.collection(collection).doc(this.safeFirestoreId(id, `${collection}-${operations.length}`)),
                        data: this.sanitizeForFirestore({ ...data, schemaVersion: 2, migrationId, migratedAt })
                    });

                    (state.patients || []).forEach((patient, patientIndex) => {
                        const { records = [], ...profile } = patient || {};
                        const patientId = this.safeFirestoreId(patient?.id, `patient-${patientIndex}`);
                        add('patients', patientId, {
                            ...profile,
                            legacyId: String(patient?.id || patientId),
                            searchName: String(patient?.fullName || '').trim().toLowerCase()
                        });
                        (Array.isArray(records) ? records : []).forEach((visit, visitIndex) => {
                            const visitId = this.safeFirestoreId(visit?.id, `${patientId}-visit-${visitIndex}`);
                            add('visits', visitId, {
                                ...visit,
                                legacyId: String(visit?.id || visitId),
                                patientId,
                                patientLegacyId: String(patient?.id || patientId)
                            });
                        });
                    });

                    [
                        ['appointments', state.appointments],
                        ['invoices', state.invoices],
                        ['prescriptions', state.prescriptions],
                        ['expenses', state.expenses],
                        ['waitingQueue', state.waitingQueue]
                    ].forEach(([collection, items]) => (items || []).forEach((item, index) => {
                        const id = this.safeFirestoreId(item?.id, `${collection}-${index}`);
                        add(collection, id, { ...item, legacyId: String(item?.id || id) });
                    }));

                    add('settings', 'general', {
                        doctorInfo: state.doctorInfo || {},
                        clinics: state.clinics || [],
                        visitTypePrices: state.visitTypePrices || {},
                        idleLockEnabled: Boolean(state.idleLockEnabled),
                        idleLockMinutes: Number(state.idleLockMinutes || 15),
                        branding: { logoUrl: this.clinicLogoUrl || '', logoStoragePath: this.clinicLogoStoragePath || '' }
                    });
                    add('catalogs', 'clinical', {
                        symptomsList: state.symptomsList || [],
                        chronicDiseasesList: state.chronicDiseasesList || [],
                        diagnosesMasterList: state.diagnosesMasterList || [],
                        medicinesMasterList: state.medicinesMasterList || [],
                        labTestsMasterList: state.labTestsMasterList || [],
                        radiologyMasterList: state.radiologyMasterList || [],
                        vitalSignsMasterList: state.vitalSignsMasterList || [],
                        expenseCategories: state.expenseCategories || [],
                        recordFormSections: state.recordFormSections || []
                    });
                    add('catalogs', 'templates', {
                        recurringPrescriptionLists: state.recurringPrescriptionLists || [],
                        recurringNotesList: state.recurringNotesList || [],
                        recurringMedicinesList: state.recurringMedicinesList || []
                    });
                    (state.auditLog || []).forEach((entry, index) => {
                        const auditId = this.safeFirestoreId(entry?.id, `audit-${index}`);
                        add('auditLogs', auditId, { ...entry, legacyId: String(entry?.id || auditId) });
                    });
                    (state.archiveManifests || []).forEach((manifest, index) => {
                        const archiveId = this.safeFirestoreId(manifest?.id, `archive-${index}`);
                        add('archiveManifests', archiveId, { ...manifest, legacyId: String(manifest?.id || archiveId) });
                    });
                    return operations;
                },
                buildTopLevelMigrationOperations(state, migrationId, migratedAt = this.getTopLevelMigrationState().lastCompletedAt || new Date().toISOString()) {
                    const sourceMigrationId = this.dataMigration?.migrationId || 'legacy-v2-recovery';
                    return this.buildV2MigrationOperations(state, sourceMigrationId, migratedAt).map(operation => {
                        const collection = operation.ref.parent.id;
                        const sourceDocumentId = operation.ref.id;
                        return {
                            ref: this.getTopLevelCollection(collection).doc(this.getTopLevelDocumentId(collection, sourceDocumentId)),
                            data: this.sanitizeForFirestore({
                                ...operation.data,
                                clinicId: String(this.cloudClinicId),
                                sourceDocumentId,
                                schemaVersion: 3,
                                topLevelMigrationId: migrationId,
                                topLevelMigratedAt: migratedAt
                            })
                        };
                    });
                },
                getV2MirrorFingerprint(value) {
                    const serialized = JSON.stringify(this.sanitizeForFirestore(value));
                    let hash = 2166136261;
                    for (let index = 0; index < serialized.length; index += 1) {
                        hash ^= serialized.charCodeAt(index);
                        hash = Math.imul(hash, 16777619);
                    }
                    return `${serialized.length}:${hash >>> 0}`;
                },
                getV2MirrorStorageKey() {
                    const schema = this.isTopLevelOperationalSyncActive() ? 'v3-top-level' : 'v2-nested';
                    return `soliMedicalDocumentMirrorFingerprints_v1:${schema}:${this.cloudClinicId}`;
                },
                loadV2MirrorFingerprints() {
                    try {
                        const saved = JSON.parse(localStorage.getItem(this.getV2MirrorStorageKey()) || '{}');
                        this.v2MirrorFingerprints = saved && typeof saved === 'object' ? saved : {};
                    } catch (error) {
                        this.v2MirrorFingerprints = {};
                    }
                },
                saveV2MirrorFingerprints() {
                    try { localStorage.setItem(this.getV2MirrorStorageKey(), JSON.stringify(this.v2MirrorFingerprints || {})); } catch (error) {}
                },
                isV2OperationalSyncActive(migration = this.dataMigration) {
                    return Boolean(migration?.status === 'completed' && migration?.migrationId && migration?.dualWriteEnabled !== false);
                },
                isV2OperationalKey(key) {
                    return !['users', 'syncConflicts', 'dataMigration'].includes(key);
                },
                getV2OperationalCollectionNames() {
                    return ['patients', 'visits', 'appointments', 'invoices', 'prescriptions', 'expenses', 'waitingQueue', 'auditLogs', 'archiveManifests', 'settings', 'catalogs'];
                },
                stripV2Metadata(value) {
                    const { schemaVersion, migrationId, migratedAt, legacyId, updatedAt, clinicId, sourceDocumentId, topLevelMigrationId, topLevelMigratedAt, ...record } = value || {};
                    return record;
                },
                hydrateV2StateFromCollectionCache() {
                    const cache = this.v2OperationalCollectionCache || {};
                    const recordsFor = name => (cache[name] || []).map(item => this.stripV2Metadata(item));
                    const patientDocs = cache.patients || [];
                    const visitsByPatient = new Map();
                    recordsFor('visits').forEach(visit => {
                        const patientId = String(visit.patientId || visit.patientLegacyId || '');
                        if (!visitsByPatient.has(patientId)) visitsByPatient.set(patientId, []);
                        const { patientId: _patientId, patientLegacyId: _patientLegacyId, ...record } = visit;
                        visitsByPatient.get(patientId).push(record);
                    });
                    const patients = patientDocs.map(doc => {
                        const profile = this.stripV2Metadata(doc);
                        const sourceDocumentId = doc.sourceDocumentId || doc._sourceDocumentId || doc._documentId;
                        const id = profile.id ?? profile.legacyId ?? sourceDocumentId;
                        return { ...profile, id, records: visitsByPatient.get(String(sourceDocumentId || id)) || [] };
                    });
                    const isSourceDocument = (item, id) => (item?.sourceDocumentId || item?._sourceDocumentId || item?._documentId) === id;
                    const setting = (cache.settings || []).find(item => isSourceDocument(item, 'general'));
                    const clinicalCatalog = (cache.catalogs || []).find(item => isSourceDocument(item, 'clinical'));
                    const templatesCatalog = (cache.catalogs || []).find(item => isSourceDocument(item, 'templates'));
                    const general = this.stripV2Metadata(setting);
                    const clinical = this.stripV2Metadata(clinicalCatalog);
                    const templates = this.stripV2Metadata(templatesCatalog);
                    return {
                        patients,
                        appointments: recordsFor('appointments'),
                        invoices: recordsFor('invoices'),
                        prescriptions: recordsFor('prescriptions'),
                        expenses: recordsFor('expenses'),
                        waitingQueue: recordsFor('waitingQueue'),
                        auditLog: recordsFor('auditLogs'),
                        archiveManifests: recordsFor('archiveManifests'),
                        ...(general || {}),
                        ...(clinical || {}),
                        ...(templates || {})
                    };
                },
                applyV2RemoteState(reason = 'تحديث سحابي من مخطط V2') {
                    if (!this.v2OperationalReady || this.localChangesPending || this.applyingRemoteUpdate) return false;
                    const remoteState = this.hydrateV2StateFromCollectionCache();
                    this.applyingRemoteUpdate = true;
                    this.persistentKeys.forEach(key => {
                        if (this.isV2OperationalKey(key) && remoteState[key] !== undefined) this[key] = remoteState[key];
                    });
                    this.persistState();
                    this.renderIcons();
                    this.$nextTick(() => {
                        this.applyingRemoteUpdate = false;
                        this.cloudStatus = navigator.onLine ? 'online' : 'offline';
                    });
                    return true;
                },
                async startV2OperationalSync() {
                    if (!this.isOperationalDocumentSyncActive() || !this.cloudAuthReady || !this.cloudMembershipReady || !firestoreDB || this.v2OperationalInitialLoadInFlight || this.v2OperationalUnsubscribers.length) return;
                    this.v2OperationalInitialLoadInFlight = true;
                    try {
                        const names = this.getV2OperationalCollectionNames();
                        const results = await Promise.allSettled(names.map(name => this.getOperationalCollectionQuery(name).get()));
                        const failedCollections = results
                            .map((result, index) => result.status === 'rejected' ? names[index] : null)
                            .filter(Boolean);
                        this.v2OperationalErrors = failedCollections;
                        this.v2OperationalCollectionCache = results.reduce((cache, result, index) => {
                            if (result.status === 'fulfilled') cache[names[index]] = result.value.docs.map(doc => ({ ...doc.data(), _documentId: doc.id }));
                            return cache;
                        }, {});
                        this.v2OperationalReady = failedCollections.length === 0;
                        if (this.v2OperationalReady) this.applyV2RemoteState('التحميل الأول من مخطط V2');
                        if (failedCollections.length) {
                            console.warn(`تعذر التحميل الأول لبعض مجموعات Firestore: ${failedCollections.join('، ')}. ستستمر المحاولة في الخلفية دون تعطيل الحفظ المحلي أو حالة الاتصال.`);
                        }
                        this.v2OperationalUnsubscribers = names.map(name => this.getOperationalCollectionQuery(name).onSnapshot(
                            { includeMetadataChanges: true },
                            snapshot => {
                                if (snapshot.metadata.hasPendingWrites) return;
                                this.v2OperationalCollectionCache = {
                                    ...this.v2OperationalCollectionCache,
                                    [name]: snapshot.docs.map(doc => ({ ...doc.data(), _documentId: doc.id }))
                                };
                                this.v2OperationalErrors = (this.v2OperationalErrors || []).filter(item => item !== name);
                                this.v2OperationalReady = this.v2OperationalErrors.length === 0;
                                if (this.v2OperationalReady) this.applyV2RemoteState('تحديث سحابي من مخطط V2');
                            },
                            error => {
                                console.error(`تعذر متابعة مجموعة V2 ${name}:`, error);
                                this.v2OperationalErrors = [...new Set([...(this.v2OperationalErrors || []), name])];
                                this.v2OperationalReady = false;
                                if (!this.cloudAuthReady || !this.cloudMembershipReady || !navigator.onLine) this.cloudStatus = 'offline';
                            }
                        ));
                    } catch (error) {
                        console.error('تعذر تحميل بيانات العيادة من مخطط Firestore V2:', error);
                        this.v2OperationalReady = false;
                        this.v2OperationalErrors = this.getV2OperationalCollectionNames();
                        if (!this.cloudAuthReady || !this.cloudMembershipReady || !navigator.onLine) this.cloudStatus = 'offline';
                    } finally {
                        this.v2OperationalInitialLoadInFlight = false;
                    }
                },
                stopV2OperationalSync() {
                    (this.v2OperationalUnsubscribers || []).forEach(unsubscribe => unsubscribe());
                    this.v2OperationalUnsubscribers = [];
                    this.v2OperationalCollectionCache = {};
                    this.v2OperationalReady = false;
                    this.v2OperationalErrors = [];
                },
                queueV2MirroredChanges() {
                    if (this.isV2OperationalSyncActive()) return this.queueCloudSync();
                    if (this.dataMigration?.status !== 'completed' || !this.cloudSyncEnabled || !this.cloudAuthReady || !firestoreDB) return;
                    clearTimeout(this.v2MirrorTimer);
                    this.v2MirrorTimer = setTimeout(() => this.flushV2MirroredChanges(), 900);
                },
                async flushV2MirroredChanges({ operationalWrite = false } = {}) {
                    if (this.v2MirrorInFlight || this.dataMigration?.status !== 'completed' || !navigator.onLine || !(await this.waitForCloudAuthReady())) return { ok: false, deferred: true };
                    this.v2MirrorInFlight = true;
                    try {
                        const state = this.getSyncDataSnapshot();
                    const topLevel = this.getTopLevelMigrationState();
                    const operations = this.isTopLevelOperationalSyncActive()
                        ? this.buildTopLevelMigrationOperations(state, topLevel.migrationId, topLevel.lastCompletedAt)
                        : this.buildV2MigrationOperations(state, this.dataMigration.migrationId, this.dataMigration.lastCompletedAt);
                        const changed = operations.filter(operation => {
                            const key = operation.ref.path;
                            const fingerprint = this.getV2MirrorFingerprint(operation.data);
                            operation.fingerprint = fingerprint;
                            return this.v2MirrorFingerprints[key] !== fingerprint;
                        });
                        for (let offset = 0; offset < changed.length; offset += 400) {
                            const batch = firestoreDB.batch();
                            changed.slice(offset, offset + 400).forEach(operation => batch.set(operation.ref, operation.data, { merge: true }));
                            await batch.commit();
                        }
                        changed.forEach(operation => { this.v2MirrorFingerprints[operation.ref.path] = operation.fingerprint; });
                        this.saveV2MirrorFingerprints();
                        const wasApplyingRemoteUpdate = this.applyingRemoteUpdate;
                        this.applyingRemoteUpdate = true;
                        const statusKey = this.isTopLevelOperationalSyncActive() ? 'topLevelCollections' : null;
                        const syncState = { dualWriteStatus: changed.length ? 'synced' : 'up_to_date', lastDualWriteAt: new Date().toISOString(), lastError: '' };
                        this.dataMigration = statusKey
                            ? { ...this.dataMigration, [statusKey]: { ...this.getTopLevelMigrationState(), ...syncState } }
                            : { ...this.dataMigration, ...syncState };
                        this.persistState();
                        this.$nextTick(() => { this.applyingRemoteUpdate = wasApplyingRemoteUpdate; });
                        return { ok: true, changed: changed.length };
                    } catch (error) {
                        console.error('تعذرت الكتابة المزدوجة إلى Firestore V2:', error);
                        const wasApplyingRemoteUpdate = this.applyingRemoteUpdate;
                        this.applyingRemoteUpdate = true;
                        const statusKey = this.isTopLevelOperationalSyncActive() ? 'topLevelCollections' : null;
                        const syncState = { dualWriteStatus: 'pending_retry', lastError: `تعذرت مزامنة وثائق البيانات: ${String(error?.message || error)}` };
                        this.dataMigration = statusKey
                            ? { ...this.dataMigration, [statusKey]: { ...this.getTopLevelMigrationState(), ...syncState } }
                            : { ...this.dataMigration, ...syncState };
                        this.persistState();
                        this.$nextTick(() => { this.applyingRemoteUpdate = wasApplyingRemoteUpdate; });
                        if (!operationalWrite) setTimeout(() => this.queueV2MirroredChanges(), 4000);
                        return { ok: false, error };
                    } finally {
                        this.v2MirrorInFlight = false;
                    }
                },
                async verifyV2MigrationConsistency() {
                    if (this.currentUser?.role !== 'admin') { alert('التحقق من المطابقة متاح لمدير النظام فقط.'); return; }
                    if (!navigator.onLine || !(await this.waitForCloudAuthReady())) { alert('يلزم اتصال Firebase للتحقق من المطابقة. لم تتغير أي بيانات.'); return; }
                    const state = this.getSyncDataSnapshot();
                    const expected = {
                        ...this.getMigrationCounts(state),
                        auditLogs: (state.auditLog || []).length,
                        archiveManifests: (state.archiveManifests || []).length
                    };
                    const collectionNames = ['patients', 'visits', 'appointments', 'invoices', 'prescriptions', 'expenses', 'waitingQueue', 'auditLogs', 'archiveManifests'];
                    try {
                        const snapshots = await Promise.all(collectionNames.map(name => this.getV2Collection(name).get()));
                        const actual = snapshots.reduce((result, snapshot, index) => ({ ...result, [collectionNames[index]]: snapshot.size }), {});
                        const compare = { patients: expected.patients, visits: expected.visits, appointments: expected.appointments, invoices: expected.invoices, prescriptions: expected.prescriptions, expenses: expected.expenses, waitingQueue: expected.waitingQueue, auditLogs: expected.auditLogs, archiveManifests: expected.archiveManifests };
                        const mismatches = Object.keys(compare).filter(key => Number(actual[key] || 0) < Number(compare[key] || 0));
                        const validation = { checkedAt: new Date().toISOString(), expected: compare, actual, matches: mismatches.length === 0, mismatches };
                        this.dataMigration = { ...this.dataMigration, validation, status: validation.matches ? 'completed' : 'needs_review', lastError: validation.matches ? '' : `تحتاج ${mismatches.join('، ')} إلى مراجعة قبل تحويل القراءة.` };
                        this.persistState();
                        if (validation.matches) alert('اكتملت مطابقة V2: لا توجد وثائق ناقصة مقارنة بالمصدر القديم. تظل القراءة القديمة هي النشطة إلى أن تعتمد التحويل لاحقاً.');
                        else alert(`اكتملت المطابقة مع ملاحظات: ${mismatches.join('، ')}. لم تُحذف البيانات ولم تتحول القراءة.`);
                    } catch (error) {
                        console.error('تعذر التحقق من مطابقة Firestore V2:', error);
                        this.dataMigration = { ...this.dataMigration, status: 'needs_review', lastError: `تعذر فحص المطابقة: ${String(error?.message || error)}` };
                        this.persistState();
                    }
                },
                prepareV2MigrationPreview() {
                    if (this.currentUser?.role !== 'admin') { alert('معاينة الترحيل متاحة لمدير النظام فقط.'); return; }
                    const migrationId = this.dataMigration?.migrationId || `v2-${Date.now()}`;
                    const counts = this.getMigrationCounts();
                    this.dataMigration = {
                        ...this.dataMigration,
                        schemaVersion: 2,
                        status: 'preview_ready',
                        migrationId,
                        counts,
                        lastPreviewAt: new Date().toISOString(),
                        lastError: ''
                    };
                    this.persistState();
                    this.queueCloudSync();
                    alert(`معاينة آمنة جاهزة: ${counts.patients} مريض و${counts.visits} زيارة و${counts.appointments} موعد. لم تُكتب أو تُحذف أي بيانات.`);
                },
                async runV2Migration() {
                    if (this.currentUser?.role !== 'admin') { alert('الترحيل متاح لمدير النظام فقط.'); return; }
                    if (!navigator.onLine || !(await this.waitForCloudAuthReady())) {
                        alert('يلزم اتصال إنترنت ومزامنة Firebase نشطة قبل الترحيل. لا يزال بإمكانك حفظ نسخة احتياطية محلية الآن.');
                        return;
                    }
                    const migrationId = this.dataMigration?.migrationId || `v2-${Date.now()}`;
                    const state = this.getSyncDataSnapshot();
                    const counts = this.getMigrationCounts(state);
                    if (!confirm(`سيُنشأ نسخة V2 مستقلة قابلة لإعادة التشغيل لـ ${counts.patients} مريض و${counts.visits} زيارة. لن يحذف التطبيق الوثيقة القديمة. هل تريد المتابعة؟`)) return;

                    const completedAt = new Date().toISOString();
                    const operations = this.buildV2MigrationOperations(state, migrationId, completedAt);
                    const manifestRef = this.getV2Collection('migrationManifests').doc(migrationId);
                    this.dataMigration = { ...this.dataMigration, schemaVersion: 2, status: 'running', migrationId, counts, lastError: '' };
                    this.persistState();
                    try {
                        await manifestRef.set(this.sanitizeForFirestore({
                            migrationId,
                            status: 'running',
                            source: this.cloudDocPath,
                            counts,
                            startedAt: new Date().toISOString(),
                            legacyDocumentRetained: true
                        }), { merge: true });
                        for (let offset = 0; offset < operations.length; offset += 400) {
                            const batch = firestoreDB.batch();
                            operations.slice(offset, offset + 400).forEach(operation => batch.set(operation.ref, operation.data, { merge: true }));
                            await batch.commit();
                        }
                        await manifestRef.set({
                            status: 'completed',
                            completedAt,
                            operationCount: operations.length,
                            legacyDocumentRetained: true
                        }, { merge: true });
                        this.dataMigration = { ...this.dataMigration, status: 'completed', migrationId, counts, lastCompletedAt: completedAt, dualWriteStatus: 'ready', validation: null, lastError: '' };
                        this.v2MirrorFingerprints = {};
                        this.saveV2MirrorFingerprints();
                        this.recordAudit('ترحيل Firestore V2', `اكتملت كتابة ${operations.length} وثيقة في المخطط الجديد دون حذف المصدر القديم.`);
                        alert('اكتمل إنشاء نسخة V2. يستمر التطبيق بالقراءة من المخطط القديم لحين مراجعة تقرير المطابقة واعتماد تحويل القراءة.');
                    } catch (error) {
                        console.error('تعذر إكمال ترحيل Firestore V2:', error);
                        this.dataMigration = { ...this.dataMigration, status: 'needs_review', migrationId, counts, lastError: String(error?.message || error) };
                        alert('توقف الترحيل قبل الاكتمال. لم تُحذف البيانات القديمة؛ عالج الاتصال ثم أعد تشغيله بالمعرّف نفسه دون تكرار السجلات.');

                    }
                },
                get dataMigrationStatusLabel() {
                    return ({

                    })[this.dataMigration?.status] || 'لم يبدأ';
                },

                // ---- CLINIC LOGO: FIREBASE STORAGE, NOT FIRESTORE BASE64 ----
                getClinicLogoSrc() {

                async uploadClinicLogoDataUrl(dataUrl, { silent = false } = {}) {

                            contentType: 'image/webp',

                        });

                        };
                        await this.getV2Collection('settings').doc('general').set({

                        }, { merge: true });
                        this.clinicLogoUrl = logoUrl;
                        this.clinicLogoStoragePath = snapshot.ref.fullPath;

                        if (!silent) alert('تم رفع الشعار إلى Firebase Storage وحفظ رابطه بأمان. احتُفظ بملف الشعار السابق في Storage للاسترجاع ولا يُحذف تلقائياً.');

                        this.persistState();

                async migrateLegacyClinicLogoToStorage() {

                // Shared daily/weekly/monthly period filter used by both income and expenses.
                isDateInPeriod(dateStr, period) {
                    if (period === 'all' || !dateStr) return true;
                    const d = new Date(dateStr); d.setHours(0, 0, 0, 0);
                    const today = new Date(); today.setHours(0, 0, 0, 0);
                    if (period === 'daily') return d.getTime() === today.getTime();
                    if (period === 'weekly') {
                        const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate() - 7);
                        return d >= weekAgo && d <= today;
                    }
                    if (period === 'monthly') {
                        const monthAgo = new Date(today); monthAgo.setMonth(monthAgo.getMonth() - 1);
                        return d >= monthAgo && d <= today;
                    }
                    return true;
                },

                invoiceNetTotal(invoice) {
                    const amount = Number(invoice?.amount ?? invoice?.total ?? 0);
                    const discount = Number(invoice?.discount ?? 0);
                    return Math.max(0, amount - discount);
                },

                get prescriptionGroups() {
                    const groups = {};
                    (this.prescriptions || []).forEach(rx => {
                        const key = String(rx.patientId || rx.patientName || rx.id);
                        if (!groups[key]) {
                            groups[key] = {
                                key,
                                patientId: rx.patientId || null,
                                patientName: rx.patientName || 'مريض غير محدد',
                                patientPhone: rx.patientPhone || '',
                                records: []
                            };
                        }
                        groups[key].records.push(rx);
                        if (!groups[key].patientPhone && rx.patientPhone) groups[key].patientPhone = rx.patientPhone;
                    });
                    const query = this.normalizeSearchText(this.pharmacySearch || '');
                    return Object.values(groups)
                        .filter(group => group.records.some(rx => {
                            const searchable = [group.patientName, group.patientPhone, rx.diagnosisText, rx.diagnosis, ...(rx.medicinesWithDosage || []).map(medicine => medicine?.name || '')].join(' ');
                            return this.matchesArchiveDate(rx.date, this.pharmacyYearFilter, this.pharmacyMonthFilter, this.pharmacyDayFilter)
                                && (!query || this.normalizeSearchText(searchable).includes(query));
                        }))
                        .map(group => ({
                            ...group,
                            records: [...group.records].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))
                        }))
                        .sort((a, b) => String(b.records[0]?.date || '').localeCompare(String(a.records[0]?.date || '')));

                get filteredInvoicesByPeriod() {
                    return this.invoices.filter(inv => this.isDateInPeriod(inv.date, this.incomePeriodFilter));
                },
                get totalIncomeForPeriod() {
                    return this.filteredInvoicesByPeriod.reduce((sum, inv) => sum + this.invoiceNetTotal(inv), 0);
                },
                get filteredExpensesByPeriod() {
                    return this.expenses.filter(e => this.isDateInPeriod(e.date, this.expensePeriodFilter));
                },
                get totalExpenseForPeriod() {
                    return this.filteredExpensesByPeriod.reduce((sum, e) => sum + Number(e.amount || 0), 0);
                },

                // ---- COMPREHENSIVE REPORTS (day / week / month / year across the whole system) ----
                get reportsYearOptions() {
                    const currentYear = new Date().getFullYear();
                    const years = [];
                    for (let y = currentYear; y >= currentYear - 5; y--) years.push(y.toString());
                    return years;
                },
                isDateInReportPeriod(dateStr) {
                    if (!dateStr) return false;
                    const today = new Date(); today.setHours(0, 0, 0, 0);
                    if (this.reportsPeriodType === 'daily') {
                        const d = new Date(dateStr); d.setHours(0, 0, 0, 0);
                        return d.getTime() === today.getTime();
                    }
                    if (this.reportsPeriodType === 'weekly') {
                        const d = new Date(dateStr); d.setHours(0, 0, 0, 0);
                        const weekAgo = new Date(today); weekAgo.setDate(weekAgo.getDate() - 7);
                        return d >= weekAgo && d <= today;
                    }
                    if (this.reportsPeriodType === 'monthly') {
                        const ym = this.reportsSelectedMonth || today.toISOString().slice(0, 7);
                        return dateStr.slice(0, 7) === ym;
                    }
                    if (this.reportsPeriodType === 'yearly') {
                        const y = this.reportsSelectedYear || today.getFullYear().toString();
                        return dateStr.slice(0, 4) === y.toString();
                    }
                    return true;
                },
                get reportInvoices() {
                    return this.invoices.filter(inv => this.isDateInReportPeriod(inv.date));
                },
                get reportIncome() {
                    return this.reportInvoices.reduce((sum, inv) => sum + this.invoiceNetTotal(inv), 0);
                },
                get reportExpenses() {
                    return this.expenses.filter(e => this.isDateInReportPeriod(e.date));
                },
                get reportExpenseTotal() {
                    return this.reportExpenses.reduce((sum, e) => sum + Number(e.amount || 0), 0);
                },
                get reportPatientRecords() {
                    const items = [];
                    this.patients.forEach(p => {
                        (p.records || []).forEach(rec => {
                            if (this.isDateInReportPeriod(rec.date)) items.push({ ...rec, patientName: p.fullName });
                        });
                    });
                    return items;
                },
                get reportPrescriptions() {
                    return this.prescriptions.filter(rx => this.isDateInReportPeriod(rx.date));
