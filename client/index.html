                addMedicalRecord() {
                    try {
                        if (!this.selectedPatientForRecord) {
                            alert('يرجى اختيار ملف مريض قبل حفظ الزيارة');
                            return;
                        }
                        const combinedDiagnoses = [...this.newRecordForm.selectedDiagnosesList];
                        if (this.newRecordForm.customDiagnosis.trim()) {
                            combinedDiagnoses.push(this.newRecordForm.customDiagnosis.trim());
                        }

                        if (combinedDiagnoses.length === 0) {
                            alert('يرجى اختيار أو كتابة تشخيص طبي واحد على الأقل أولاً');
                            return;
                        }

                        // Any pending text typed in the custom boxes but not yet added gets folded in too,
                        // so nothing the doctor typed is silently lost when saving.
                        if (this.newRecordForm.customLabTest.trim()) this.addCustomLabTestToRecord();
                        if (this.newRecordForm.customRadiology.trim()) this.addCustomRadiologyToRecord();
                        if (this.newRecordForm.customVital.trim()) this.addCustomVitalToRecord();

                        // Defensive: tolerate old cached data shapes (plain strings from an earlier
                        // version) as well as the current {name, result} objects, so a stale browser
                        // cache can never throw here and silently block saving.
                        const normalizeItems = (list) => (list || [])
                            .map(i => (typeof i === 'string') ? { name: i, result: '' } : i)
                            .filter(i => i && i.name && i.name.trim());

                        const finalVitals = normalizeItems(this.newRecordForm.selectedVitals);
                        const finalLabTests = normalizeItems(this.newRecordForm.selectedLabTests);
                        const finalRadiology = normalizeItems(this.newRecordForm.selectedRadiology);

                        if (!this.selectedPatientForRecord.records) {
                            this.selectedPatientForRecord.records = [];
                        }

                        const diagnosisTextSummary = combinedDiagnoses.join(' ، ');
                        const symptomList = [...(this.selectedPatientForRecord.selectedSymptoms || [])];
                        const symptomTextSummary = symptomList.join(' ، ');

                        const recordEntry = {
                            id: 'REC-' + Date.now(),
                            patientId: this.selectedPatientForRecord.id,
                            patientName: this.selectedPatientForRecord.fullName,
                            date: new Date().toISOString().split('T')[0],
                            visitType: this.selectedPatientForRecord.visitType || 'كشف',
                            symptom: symptomTextSummary,
                            symptoms: symptomList,
                            diagnosis: diagnosisTextSummary,
                            diagnosisList: combinedDiagnoses,
                            vitals: finalVitals,
                            labTests: finalLabTests,
                            radiology: finalRadiology,
                            medicinesWithDosage: [...this.newRecordForm.selectedMedicinesWithDosage],
                            nextFollowUpDate: this.newRecordForm.nextFollowUpDate || '',
                            notes: this.newRecordForm.generalNotes
                        };

                        this.selectedPatientForRecord.records.unshift(recordEntry);

                        // A prescription/visit summary is always created once a diagnosis is saved —
                        // even with no medicines — so the visit is never "lost" and can still be viewed,
                        // printed, or sent to the patient from the Prescriptions archive.
                        const rx = {
                            id: 'RX-' + Math.floor(100 + Math.random() * 900),
                            patientId: this.selectedPatientForRecord.id,
                            patientName: this.selectedPatientForRecord.fullName,
                            patientPhone: this.selectedPatientForRecord.phone,
                            symptom: symptomTextSummary,
                            symptoms: symptomList,
                            diagnosisText: diagnosisTextSummary,
                            vitals: finalVitals,
                            labTests: finalLabTests,
                            radiology: finalRadiology,
                            medicinesWithDosage: [...this.newRecordForm.selectedMedicinesWithDosage],
                            nextFollowUpDate: this.newRecordForm.nextFollowUpDate || '',
                            date: new Date().toISOString().split('T')[0]
                        };
                        this.prescriptions.unshift(rx);

                        // Keep a compact in-memory source for the recurring-lists button even after
                        // the visit form is reset. This does not alter the medical record itself.
                        this.lastPrescriptionReusableData = {
                            selectedDiagnosesList: [...combinedDiagnoses],
                            customDiagnosis: '',
                            generalNotes: this.newRecordForm.generalNotes || '',
                            selectedMedicinesWithDosage: [...this.newRecordForm.selectedMedicinesWithDosage]
                        };

                        this.removeFromQueueForPatient(this.selectedPatientForRecord.id);

                        this.newRecordForm = {
                            selectedDiagnosesList: [], customDiagnosis: '',
                            selectedVitals: [], customVital: '',
                            selectedLabTests: [], customLabTest: '',
                            selectedRadiology: [], customRadiology: '',
                            selectedMedicinesWithDosage: [], nextFollowUpDate: '', generalNotes: ''
                        };
                        this.renderIcons();
                        alert('تم حفظ الزيارة وتوليد الروشتة بنجاح. ستظل داخل ملف المريض ويمكنك طباعة الروشتة الآن ✅');
                    } catch (err) {
                        console.error('addMedicalRecord failed:', err);
                        alert('حدث خطأ غير متوقع أثناء الحفظ: ' + err.message + '\n\nجرّب الضغط على Ctrl+Shift+R لتحديث الصفحة بالكامل، أو استخدم زر "إعادة ضبط البيانات المحلية" في الإعدادات إذا استمرت المشكلة.');
                    }
                },

                getPrescriptionPrintLayout(rx) {
                    const medicines = Array.isArray(rx?.medicinesWithDosage) ? rx.medicinesWithDosage : [];
                    const textLength = [
                        rx?.symptomText || rx?.symptom || '',
                        rx?.diagnosisText || rx?.diagnosis || '',
                        this.formatResultItems(rx?.vitals),
                        this.formatResultItems(rx?.labTests),
                        this.formatResultItems(rx?.radiology)
                    ].join(' ').trim().length;
                    const medicineLength = medicines.reduce((sum, item) => sum + String(item?.name || '').length + String(item?.timing || '').length + String(item?.extraDosageNotes || '').length, 0);
                    const score = textLength + medicineLength + (medicines.length * 42);
                    const automaticScale = score > 1250 ? 0.76 : score > 980 ? 0.84 : score > 720 ? 0.91 : score > 480 ? 0.96 : 1;
                    const manualScale = Math.min(1, Math.max(0.7, Number(this.doctorInfo?.printContentScale ?? 1) || 1));
                    const scale = this.doctorInfo?.printAutoScale === false ? manualScale : automaticScale;
                    return {
                        density: scale < 0.86 ? 'compact' : (scale < 0.98 ? 'tight' : 'normal'),
                        scale,
                        split: score > 1500 || medicines.length > 12
                    };
                },
                savePrintSettings(showMessage = false) {
                    if (!this.validateDoctorContactNumbers()) return;
                    this.persistState();
                    this.queueCloudSync();
                    if (this.selectedPrescriptionForPrint) this.updatePrescriptionPrintMode();
                    else if (this.showPrescriptionPrintModal) this.$nextTick(() => this.refreshPrescriptionQrCode());
                    if (showMessage) alert('تم حفظ إعدادات طباعة الروشتة محلياً وبدء مزامنتها مع السحابة.');
                },
                refreshPrintSettingsPreview() {
                    if (this.selectedPrescriptionForPrint) this.updatePrescriptionPrintMode();
                    else this.$nextTick(() => this.refreshPrescriptionQrCode());
                },
                getPrescriptionPrintScale() {
                    if (!this.printPrescriptionSplitPage) return this.printDensityScale;
                    if (this.doctorInfo?.printAutoScale !== false) return 1;
                    return Math.min(1, Math.max(0.7, Number(this.doctorInfo?.printContentScale ?? 1) || 1));
                },
                printPrescription(rx, patientObj) {
                    this.selectedPrescriptionForPrint = {
                        ...rx,
                        patientName: rx.patientName || (patientObj ? patientObj.fullName : ''),
                        patientPhone: rx.patientPhone || (patientObj ? patientObj.phone : ''),
                        patientAge: patientObj ? patientObj.age : '',
                        patientGender: patientObj ? patientObj.gender : ''
                    };
                    const printLayout = this.getPrescriptionPrintLayout(this.selectedPrescriptionForPrint);
                    this.printDensity = printLayout.density;
                    this.printDensityScale = printLayout.scale;
                    this.printPrescriptionSplitPage = printLayout.split;
                    this.printPageMode = 'one';
                    this.showPrescriptionPrintModal = true;
                    this.$nextTick(() => this.refreshPrescriptionQrCode());
                },
                printPrescriptionA5(rx, patientObj) {
                    this.printPrescription(rx, patientObj);
                    this.$nextTick(() => window.setTimeout(() => this.triggerPrintWindow(), 180));
                },
                updatePrescriptionPrintMode() {
                    const autoSplit = this.getPrescriptionPrintLayout(this.selectedPrescriptionForPrint || {}).split;
                    const printLayout = this.getPrescriptionPrintLayout(this.selectedPrescriptionForPrint || {});
                    this.printDensity = printLayout.density;
                    this.printDensityScale = this.printPageMode === 'one' ? printLayout.scale : 1;
                    this.printPrescriptionSplitPage = this.printPageMode === 'two' || (this.printPageMode === 'auto' && autoSplit);
                    this.$nextTick(() => this.refreshPrescriptionQrCode());
                },
                getClinicQrLink() {
                    const info = this.doctorInfo || {};
                    const mode = info.qrMode || 'whatsapp';
                    if (mode === 'booking') {
                        const bookingLink = String(info.bookingLink || '').trim() || this.getBookingShareUrl();
                        return /^https?:\/\//i.test(bookingLink) ? bookingLink : `https://${bookingLink}`;
                    }
                    if (mode === 'custom') {
                        const alternateLink = String(info.alternateQrLink || '').trim();
                        if (!alternateLink) return '';
                        return /^https?:\/\//i.test(alternateLink) ? alternateLink : `https://${alternateLink}`;
                    }
                    const raw = String(info.qrContact || '').trim();
                    const phone = raw || this.clinics?.[0]?.phone || info.phone || '';
                    const waPhone = this.formatPhoneForWhatsApp(phone);
                    return waPhone ? `https://wa.me/${waPhone}` : '';
                },
                refreshPrescriptionQrCode() {
                    this.$nextTick(() => {
                        const target = document.getElementById('prescriptionQrCode');
                        if (!target || !this.selectedPrescriptionForPrint) return;
                        target.innerHTML = '';
                        const qrText = this.getClinicQrLink();
                        if (!qrText) {
                            target.textContent = 'أضف رابط QR من الإعدادات';
                            target.classList.add('prescription-qr-fallback');
                            return;
                        }
                        target.classList.remove('prescription-qr-fallback');
                        const qrSizeMap = { small: 56, medium: 76, large: 96 };
                        const qrPx = qrSizeMap[this.doctorInfo?.printQrSize || 'medium'] || 76;
                        if (window.QRCode) {
                            new QRCode(target, {
                                text: qrText,
                                width: qrPx,
                                height: qrPx,
                                colorDark: '#0f2d4a',
                                colorLight: '#ffffff',
                                correctLevel: QRCode.CorrectLevel.M
                            });
                        } else {
                            target.textContent = 'QR';
                            target.classList.add('prescription-qr-fallback');
                        }
                    });
                },

                // Normalizes any locally-entered phone number (e.g. 01021434947 or 1021434947)
                // into full international format required by wa.me (e.g. 201021434947).
                // Formats an array of {name, result} items into a readable "Name: Result" list,
                // used for both the printed prescription and the WhatsApp message.
                formatResultItems(items) {
                    if (!items || items.length === 0) return '';
                    return items.map(i => i.result ? `${i.name}: ${i.result}` : i.name).join(' ، ');
                },

                formatPhoneForWhatsApp(phone) {
                    const localPhone = normalizeEgyptianPhone(phone);
                    return localPhone ? `20${localPhone.slice(1)}` : '';
                },

                validateAndNormalizePhone(value, label = 'رقم الهاتف') {
                    const raw = String(value || '').trim();
                    if (!raw) return '';
                    const normalized = normalizeEgyptianPhone(raw);
                    if (normalized) return normalized;
                    alert(`${label} غير صحيح. أدخل رقم محمول مصري صحيحاً من 11 رقماً، مثل: 01012345678.`);
                    return null;
                },

                validateDoctorContactNumbers() {
                    const doctorPhone = this.validateAndNormalizePhone(this.doctorInfo?.phone, 'رقم هاتف الطبيب');
                    if (doctorPhone === null) return false;
                    const qrPhone = this.validateAndNormalizePhone(this.doctorInfo?.qrContact, 'رقم واتساب QR');
                    if (qrPhone === null) return false;
                    this.doctorInfo.phone = doctorPhone;
                    this.doctorInfo.qrContact = qrPhone;
                    return true;
                },

                saveDoctorInfo() {
                    if (!this.validateDoctorContactNumbers()) return;
                    this.persistState();
                    this.queueCloudSync();
                    alert('تم حفظ إعدادات الطبيب والروشتة ورابط QR بنجاح!');
                },

                sendWhatsAppPrescription(rx, patientObj) {
                    const phone = (patientObj ? patientObj.phone : rx.patientPhone) || '';
                    const waPhone = this.formatPhoneForWhatsApp(phone);
                    if (!waPhone) {
                        alert('لم يتم تسجيل رقم هاتف للمريض لإرسال الروشتة عبر الواتساب');
                        return;
                    }
                    const patientName = rx.patientName || (patientObj ? patientObj.fullName : '');
                    const medsText = (rx.medicinesWithDosage || []).map((m, i) => `${i + 1}. *${m.name}*\n    ⏰ ${m.timing}${m.extraDosageNotes ? ' - ' + m.extraDosageNotes : ''}`).join('\n');
                    const followUpBlock = rx.nextFollowUpDate ? `\n\n📅 *موعد المتابعة القادمة:*\n${rx.nextFollowUpDate}` : '';
                    const vitalsBlock = (rx.vitals && rx.vitals.length > 0) ? `\n\n❤️ *العلامات الحيوية:*\n${this.formatResultItems(rx.vitals)}` : '';
                    const labBlock = (rx.labTests && rx.labTests.length > 0) ? `\n\n🧪 *المعمل:*\n${this.formatResultItems(rx.labTests)}` : '';
                    const radiologyBlock = (rx.radiology && rx.radiology.length > 0) ? `\n\n📷 *الأشعة:*\n${this.formatResultItems(rx.radiology)}` : '';

                    const message = `🏥 *${this.doctorInfo.fullName}*\n${this.doctorInfo.specialty}\n➖➖➖➖➖➖➖➖➖➖\n\nأهلاً بك ${patientName} 🌺\nهذه بيانات الروشتة الخاصة بك:\n\n🩺 *التشخيص:*\n${rx.diagnosisText || rx.diagnosis || 'فحص واستشارة طبية'}${vitalsBlock}\n\n💊 *الأدوية الموصوفة:*\n${medsText || 'لا توجد أدوية مسجلة'}${labBlock}${radiologyBlock}${followUpBlock}\n\n➖➖➖➖➖➖➖➖➖➖\nتمنياتنا لك بالشفاء العاجل ❤️`;

                    window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(message)}`, '_blank');
                },

                sendFollowUpReminder(item) {
                    const waPhone = this.formatPhoneForWhatsApp(item.phone);
                    if (!waPhone) {
                        alert('لم يتم تسجيل رقم هاتف لهذا المريض لإرسال التذكير عبر الواتساب');
                        return;
                    }
                    const clinicName = this.clinics[0]?.name || 'العيادة';
                    const clinicPhone = this.clinics[0]?.phone || this.doctorInfo.phone;
                    const message = `🔔 *تذكير بموعد المتابعة*\n\nأهلاً بك ${item.patientName} 🌸\n\nنود تذكيرك بموعد المتابعة القادم لدى:\n👨‍⚕️ *الطبيب:* ${this.doctorInfo.fullName}\n🏥 *العيادة:* ${clinicName}\n📅 *التاريخ:* ${item.date}\n☎️ *للتواصل:* ${clinicPhone}\n\nنرجو الحضور في الموعد، وفي حال الرغبة بالتأجيل يرجى التواصل معنا مسبقاً.\nتمنياتنا لك بدوام الصحة والعافية 🌿`;
                    window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(message)}`, '_blank');
                },

                // PDF Export Simulation via standard Print/PDF saver
                exportPrescriptionPDF(rx, patientObj) {
                    this.printPrescriptionA5(rx, patientObj);
                },
                triggerPrintWindow() {
                    const previousTitle = document.title;
                    document.title = '';
                    window.print();
                    setTimeout(() => {
                        document.title = previousTitle;
                    }, 1000);
                },

                openInvoiceModal() {
                    this.invoiceForm = {
                        patientName: this.patients[0]?.fullName || '',
                        serviceName: 'كشف واستشارة طبية',
                        amount: 200,
                        discount: 0,
                        status: 'مدفوعة'
                    };
                    this.showInvoiceModal = true;
                },

                saveInvoice() {
                    const amount = Number(this.invoiceForm.amount || 0);
                    const discount = Number(this.invoiceForm.discount || 0);
                    const total = Math.max(0, amount - discount);

                    this.invoices.unshift({
                        id: 'INV-' + Math.floor(1000 + Math.random() * 9000),
                        patientName: this.invoiceForm.patientName,
                        serviceName: this.invoiceForm.serviceName,
                        amount,
                        discount,
                        tax: 0,
                        total,
                        date: new Date().toISOString().split('T')[0],
                        status: this.invoiceForm.status
                    });
                    this.showInvoiceModal = false;
                    this.renderIcons();
                },

                deleteInvoice(invoiceId) {
                    const invoice = (this.invoices || []).find(item => String(item.id) === String(invoiceId));
                    if (!invoice) return;
                    const amount = this.invoiceNetTotal(invoice).toLocaleString('ar-EG');
                    if (!confirm(`سيتم حذف التحصيل فقط للمريض ${invoice.patientName || 'غير المسجل'} بقيمة ${amount} ج.م. لن يتم حذف ملف المريض أو أي زيارة طبية. هل تريد المتابعة؟`)) return;
                    this.invoices = (this.invoices || []).filter(item => String(item.id) !== String(invoiceId));
                    this.recordAudit('حذف تحصيل', `${invoice.patientName || 'مريض غير مسجل'} — ${amount} ج.م`);
                    this.persistState();
                    this.queueCloudSync();
                },

                openClinicModal(clinic = null) {
                    if (clinic) {
                        this.editingClinic = clinic;
                        this.clinicForm = { name: clinic.name, location: clinic.location, hours: clinic.hours, phone: clinic.phone || '' };
                    } else {
                        this.editingClinic = null;
                        this.clinicForm = { name: '', location: 'المبنى A - الدور الأول', hours: '08:00 ص - 04:00 م', phone: '' };
                    }
                    this.showClinicModal = true;
                },

                saveClinic() {
                    if (!this.clinicForm.name.trim()) {
                        alert('يرجى إدخال اسم الفرع');
                        return;
                    }
                    const validPhone = this.validateAndNormalizePhone(this.clinicForm.phone, 'رقم هاتف الفرع');
                    if (validPhone === null) return;
                    this.clinicForm.phone = validPhone;
                    if (this.editingClinic) {
                        const idx = this.clinics.findIndex(c => c.id === this.editingClinic.id);
                        if (idx > -1) {
                            this.clinics[idx] = { ...this.clinics[idx], ...this.clinicForm };
                        }
                    } else {
                        this.clinics.push({ id: Date.now(), ...this.clinicForm });
                    }
                    this.showClinicModal = false;
                    this.editingClinic = null;
                    this.renderIcons();
                },

                deleteClinic(clinicId) {
                    if (!confirm('هل تريد حذف هذا الفرع نهائياً؟')) return;
                    this.clinics = this.clinics.filter(c => c.id !== clinicId);
                },

                editPatient(patient) {
                    this.editingPatient = patient;
                    this.patientForm = {
                        ...patient,
                        visitType: patient.visitType || 'كشف',
                        selectedSymptoms: patient.selectedSymptoms || [],
                        selectedChronicDiseases: patient.selectedChronicDiseases || []
                    };
                    this.navigateTo('patientForm');
                },

                deletePatient(id) {
                    const patient = this.patients.find(p => p.id === id);
                    if (!patient) return;
                    const patientName = String(patient.fullName || '').trim();
                    if (!confirm(`سيتم حذف ملف ${patientName || 'المريض'} وكل الزيارات والوصفات والفواتير وقائمة الانتظار المرتبطة به. لا يمكن التراجع عن هذا الإجراء. هل تريد المتابعة؟`)) return;
                    this.patients = this.patients.filter(p => p.id !== id);
                    this.prescriptions = (this.prescriptions || []).filter(rx => rx.patientId !== id && String(rx.patientName || '').trim() !== patientName);
                    this.waitingQueue = (this.waitingQueue || []).filter(item => item.patientId !== id && String(item.patientName || '').trim() !== patientName);
                    this.appointments = (this.appointments || []).filter(item => item.patientId !== id && String(item.patientName || '').trim() !== patientName);
                    this.invoices = (this.invoices || []).filter(invoice => invoice.patientId !== id && String(invoice.patientName || '').trim() !== patientName);
                    if (this.selectedPatientForRecord?.id === id) this.selectedPatientForRecord = null;
                    if (this.openPrescriptionPatientId === String(id)) this.openPrescriptionPatientId = null;
                    this.patientsPage = Math.min(this.patientsPage, this.patientPageCount);
                    this.persistState();
                    this.queueCloudSync();
                },

                openWaitingPatient(item) {
                    const patient = this.patients.find(p => p.id === item.patientId) || this.patients.find(p => p.fullName === item.patientName);
                    item.status = 'in_consultation';
                    const linkedAppointment = (this.appointments || []).find(appt => appt.id === item.appointmentId);
                    if (linkedAppointment) linkedAppointment.status = 'in_consultation';
                    if (!patient) {
                        alert('لم يتم العثور على ملف هذا المريض. يمكنك حذف البطاقة من قائمة الانتظار.');
                        return;
                    }
                    this.openMedicalRecordPage(patient);
                },

                removeFromQueueForPatient(patientId) {
                    // Completion from the medical record is not a cancellation and must keep the collected invoice intact.
                    this.waitingQueue = this.waitingQueue.filter(item => item.patientId !== patientId);
                },

                removeFromQueue(id) {
                    const item = (this.waitingQueue || []).find(entry => String(entry.id) === String(id));
                    this.removeWaitingWithPaymentRefund(item, 'إزالة');
                }
            }));
        });
    </script>

                <div class="p-5 overflow-y-auto max-h-[60vh] space-y-3">
                    <template x-if="syncConflicts.length === 0">
                        <p class="text-sm text-slate-500 text-center py-8">لا توجد تعارضات مسجلة.</p>
                    </template>
                    <template x-for="conflict in syncConflicts" :key="conflict.id">
                        <article class="rounded-xl border border-amber-200 dark:border-amber-900/60 bg-amber-50/70 dark:bg-amber-950/20 p-4 space-y-2">
                            <div class="flex items-start justify-between gap-3">
                                <div>
                                    <p class="font-bold text-sm text-amber-900 dark:text-amber-200" x-text="conflict.reason"></p>
                                    <p class="text-xs text-amber-800/80 dark:text-amber-300/80 mt-1" x-text="formatSyncConflictDate(conflict.detectedAt)"></p>
                                </div>
                                <span class="text-[10px] font-bold bg-amber-200/70 dark:bg-amber-900/50 text-amber-900 dark:text-amber-200 rounded-full px-2 py-1" x-text="'إصدار ' + conflict.remoteRevision"></span>
                            </div>
                            <p class="text-xs text-slate-700 dark:text-slate-300">المستخدم المحلي: <b x-text="conflict.localUser"></b> · مصدر التعديل الآخر: <b x-text="conflict.remoteWriter"></b></p>
                            <p class="text-xs text-slate-600 dark:text-slate-400">ملخص النسخة الأخرى: مرضى <b x-text="conflict.remoteSummary?.patients || 0"></b>، زيارات <b x-text="conflict.remoteSummary?.visits || 0"></b>، فواتير <b x-text="conflict.remoteSummary?.invoices || 0"></b>، روشتات <b x-text="conflict.remoteSummary?.prescriptions || 0"></b>.</p>
                        </article>
                    </template>
                </div>
                <div class="flex items-center justify-between gap-3 p-5 border-t border-slate-200 dark:border-slate-700">
                    <div class="flex items-center gap-3">
                        <button type="button" x-show="syncConflicts.some(item => item.recoveryAvailable)" @click="restoreLatestConflictRecovery" class="text-xs font-bold text-amber-700 dark:text-amber-300 hover:underline">استعادة آخر نسخة محلية</button>
                        <button type="button" @click="clearSyncConflictLog" class="text-xs font-bold text-red-600 hover:text-red-700">مسح السجل المحلي</button>
                    </div>
                    <button type="button" @click="showSyncConflictsModal = false" class="bg-blue-600 text-white px-5 py-2 rounded-xl text-sm font-bold">إغلاق</button>
                </div>
            </div>
        </div>

    </div>
    <div x-show="showIdleLockModal" x-cloak class="fixed inset-0 z-[90] bg-slate-950/90 flex items-center justify-center p-4"><div class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-6 text-center space-y-4"><i data-lucide="lock-keyhole" class="w-10 h-10 mx-auto text-blue-600"></i><div><h3 class="font-bold text-slate-800 dark:text-white">تم قفل الشاشة تلقائياً</h3><p class="text-xs text-slate-500 mt-1">أدخل كلمة مرور المستخدم الحالي للمتابعة.</p></div><input type="password" x-model="idleUnlockPassword" @keydown.enter.prevent="unlockIdleSession()" autocomplete="current-password" class="w-full px-4 py-3 border rounded-xl text-center bg-slate-50 dark:bg-slate-800 dark:border-slate-700"><button type="button" @click="unlockIdleSession()" class="w-full px-4 py-3 rounded-xl font-bold bg-blue-600 text-white">فتح النظام</button></div></div>
        </div>
    </template>
</body>
    <script>
        if ('serviceWorker' in navigator && !publicBookingMode) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Soli Medical Service Worker:', error));
            });
        }
    </script>
</html>
